<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Wartabiye TV Admin</title>
<link rel="icon" href="../img/logo.png">
<style>
:root{--blue:#037BDC;--red:#F2060A;--fg:#0b1c33;--muted:#4a5b73;--surface:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--fg:#e7eef8;--muted:#a7b6cb;--surface:#0f1c31}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:linear-gradient(160deg,#04213f,#0a3a6e 45%,#0263b3)}
main{background:var(--surface);border-radius:20px;max-width:440px;width:100%;padding:30px 28px;box-shadow:0 30px 80px rgba(0,10,30,.45);position:relative;overflow:hidden}
main::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--blue) 0 70%,var(--red) 70%)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.brand img{border-radius:50%}
.brand b{font-size:22px;font-weight:800}.brand i{font-style:normal;background:var(--red);color:#fff;border-radius:4px;padding:0 5px;font-size:.8em}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);margin:0 0 16px}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px}
.spin{width:30px;height:30px;border:3px solid rgba(3,123,220,.25);border-top-color:var(--blue);border-radius:50%;animation:s .8s linear infinite;margin:4px 0 14px}@keyframes s{to{transform:rotate(360deg)}}
small{display:block;margin-top:14px;color:var(--muted)}small a{color:var(--blue)}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="../img/logo.png" alt="" width="48" height="48"><b>Wartabiye <i>TV</i> Admin</b></div>
  <div id="box"><div class="spin" aria-hidden="true"></div><h1>Opening the secure dashboard…</h1><p>One moment.</p></div>
</main>
<script>
// The admin dashboard lives on its own secure address (Cloudflare Worker, owner-only sign-in). This page only sends you
// there, and removes any GitHub token an older version of the dashboard saved in this browser.
(function () {
  var box = document.getElementById('box');
  function legacy() {
    box.innerHTML = '<h1>Secure dashboard: setup pending</h1><p>The new owner-only sign-in is not switched on yet. Until it is, the previous dashboard (GitHub token sign-in) still works.</p>'
      + '<a class="btn" href="legacy/">Open the previous dashboard</a><small>After the one-time setup (see <a href="https://github.com/Mahadupdalla/wartabiye-tv/blob/main/workers/admin/README.md">workers/admin/README.md</a>) this page opens the secure dashboard automatically.</small>';
  }
  fetch('../data/admin.json?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !/^https:\/\//.test(j.url)) return legacy();
    try { localStorage.removeItem('sveltia-cms.user'); localStorage.removeItem('decap-cms-user'); localStorage.removeItem('netlify-cms-user'); } catch (e) {}
    box.querySelector('p').textContent = 'Redirecting to ' + j.url;
    location.replace(j.url + (location.hash || ''));
  }).catch(legacy);
})();
</script>
</body>
</html>
