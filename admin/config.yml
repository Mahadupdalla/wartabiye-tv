# Wartabiye TV admin dashboard (Sveltia CMS).
# Login is GitHub: only accounts with write access to Mahadupdalla/wartabiye-tv can save.
# Nothing secret lives in this file.
backend:
  name: github
  repo: Mahadupdalla/wartabiye-tv
  branch: main
  # sign-in only with a GitHub access token (no third-party OAuth server)
  auth_methods: [token]
  commit_messages:
    create: 'Maamul: war cusub "{{slug}}"'
    update: 'Maamul: wax ka beddel "{{slug}}"'
    delete: 'Maamul: tirtir "{{slug}}"'
    uploadMedia: 'Maamul: sawir "{{path}}"'
    deleteMedia: 'Maamul: tirtir sawir "{{path}}"'

site_url: https://www.wartabiyetv.com/
display_url: https://www.wartabiyetv.com/
logo:
  src: ../img/logo.png

media_folder: img/news
public_folder: img/news
media_libraries:
  # no stock-photo sites: only images you upload yourself
  stock_assets: false
  default:
    config:
      max_file_size: 8000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: news
    label: Wararka
    label_singular: War
    description: Ku dar, beddel ama tirtir war. "La daabacay" dami si aad u kaydiso qabyo aan bogga ka muuqan.
    folder: data/news
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    # "View on live site" opens the article on the public site, drafts included; switch language there (top right)
    preview_path: '?preview={{filename}}'
    summary: '{{title}}'
    sortable_fields: [publishedAt, title, category]
    view_filters:
      - {label: Qabyo, field: published, pattern: false}
      - {label: 'Sugaya sawir', field: imagePending, pattern: true}
      - {label: Degdeg, field: breaking, pattern: true}
      - {label: Ciyaaraha, field: section, pattern: sports}
      - {label: Caalamka, field: section, pattern: world}
      - {label: Xayeysiis, field: sponsored, pattern: true}
    fields:
      - {name: title, label: Cinwaanka, widget: string}
      - {name: summary, label: Soo koobid, widget: text}
      - {name: body, label: Qoraalka buuxa, widget: text, required: false, hint: 'Ikhtiyaari. Qoraal adiga kuu gaar ah; ha koobiyeyn qoraalka wargeysyada kale.'}
      - name: category
        label: Qaybta
        widget: relation
        collection: settings
        file: site
        search_fields: ['categories.*']
        value_field: 'categories.*'
        display_fields: ['categories.*']
      - {name: publishedAt, label: Taariikhda la daabacay, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}'}
      - {name: published, label: La daabacay (bogga ka muuqda), widget: boolean, default: true}
      - {name: breaking, label: Degdeg (12 saac), widget: boolean, default: false}
      - {name: important, label: 'Muhiim (Muhiim hadda, 72 saac)', widget: boolean, default: false, required: false, hint: 'Warka wuxuu galayaa liiska "Muhiim hadda" 72 saac. Tani waa go''aan tifaftir, ma aha tirada akhristayaasha.'}
      - name: section
        label: Qaybta weyn (bogga)
        widget: select
        required: false
        default: somalia
        hint: 'Bariga Afrika = bogga hore (wararka gobolka); Caalamka = bogga Wararka Caalamka; Ciyaaraha = bogga Ciyaaraha. Haddii aad banaan ka tagto, Qaybta ayaa go''aamisa.'
        options: [{label: 'Bariga Afrika (bogga hore)', value: somalia}, {label: 'Wararka Caalamka', value: world}, {label: Ciyaaraha, value: sports}]
      - {name: sport, label: 'Ciyaarta (Ciyaaraha oo kaliya)', widget: select, required: false, options: [{label: 'Kubadda Cagta', value: football}, {label: 'Kubadda Koleyga', value: basketball}, {label: 'Teniska', value: tennis}, {label: 'Formula 1', value: formula1}, {label: 'Tartanka Baabuurta', value: motorsport}, {label: 'Feerka', value: boxing}, {label: 'Ciyaaraha Fudud', value: athletics}, {label: 'Kirikit', value: cricket}, {label: 'Kubadda Laliska', value: volleyball}, {label: 'Ragbi', value: rugby}, {label: 'Dabaasha', value: swimming}, {label: 'Baaskiil-wadista', value: cycling}, {label: 'Beysbool', value: baseball}, {label: 'Golf', value: golf}, {label: 'Kubadda Gacanta', value: handball}, {label: 'Badminton', value: badminton}, {label: 'Olombikada', value: olympics}, {label: 'Ciyaaraha Elektaroonigga', value: esports}, {label: 'Ciyaaro kale', value: other}]}
      - {name: competition, label: 'Horyaalka / tartanka (kubadda cagta)', widget: select, required: false, options: [{label: 'Premier League (Ingiriiska)', value: premier-league}, {label: 'La Liga (Isbaanish)', value: la-liga}, {label: 'Serie A (Talyaani)', value: serie-a}, {label: 'Bundesliga (Jarmal)', value: bundesliga}, {label: 'Ligue 1 (Faransiis)', value: ligue-1}, {label: 'UEFA Champions League', value: champions-league}, {label: 'UEFA Europa League', value: europa-league}, {label: 'UEFA Conference League', value: conference-league}, {label: 'AFCON', value: afcon}, {label: 'Koobka Adduunka FIFA', value: world-cup}, {label: 'Kubadda Cagta Afrika', value: african-football}, {label: 'Tartamada CAF', value: caf}, {label: 'Kubadda Cagta Soomaaliya', value: somali-football}, {label: 'Kubadda Cagta Caalamka', value: international}]}
      - {name: tags, label: 'Nooca warka ciyaaraha', widget: select, multiple: true, required: false, options: [{label: 'Iibka ciyaartoyda', value: transfer}, {label: 'Warbixinta ciyaarta', value: match-report}, {label: 'Wararka ciyaartoyda', value: player}, {label: 'Wararka kooxaha', value: team}]}
      - {name: region, label: 'Gobolka adduunka (Caalamka oo kaliya)', widget: select, required: false, options: [{label: 'Afrika', value: africa}, {label: 'Bariga Dhexe', value: middle-east}, {label: 'Yurub', value: europe}, {label: 'Aasiya', value: asia}, {label: 'Waqooyiga Ameerika', value: north-america}, {label: 'Koonfurta Ameerika', value: south-america}, {label: 'Caalami', value: international}]}
      - {name: topic, label: 'Mowduuca (Caalamka oo kaliya)', widget: select, required: false, options: [{label: 'Siyaasadda caalamka', value: politics}, {label: 'Dhaqaalaha adduunka', value: economy}, {label: 'Sayniska', value: science}, {label: 'Tignoolajiyadda', value: technology}, {label: 'Amniga internetka', value: cybersecurity}, {label: 'Cimilada iyo deegaanka', value: climate}, {label: 'Waxbarashada', value: education}, {label: 'Caafimaadka', value: health}]}
      - {name: sponsored, label: 'Xayeysiis (maqaal lacag lagu bixiyay)', widget: boolean, default: false, required: false, hint: 'Bogga wuxuu ku muujinayaa calaamadda XAYEYSIIS. Kama soo muuqdo Degdeg iyo Muhiim hadda.'}
      - {name: sponsor, label: 'Cidda bixisay (xayeysiis)', widget: string, required: false}
      - {name: image, label: Sawirka, widget: image, choose_url: false, required: false, hint: 'Soo geli (Upload), beddel (Replace) ama ka saar (Remove). Isticmaal sawir aad leedahay ama mid sharci ahaan la oggol yahay. Warka aan sawir lahayn bogga kama muuqdo: wuxuu sugayaa ilaa aad sawir geliso. Sawir kasta war keliya ha u ahaado.'}
      - {name: imagePending, label: 'Sugaya sawir', widget: boolean, default: false, required: false, hint: 'Hawsha wararka (saacad kasta) ayaa shidda marka aan sawir sharci ah oo warka khuseeya la helin. Warku bogga kama muuqdo ilaa sawir la geliyo. Marka aad sawir geliso, dami.'}
      - {name: imageFocus, label: 'Goobta la jarayo (crop)', widget: select, required: false, default: center, hint: 'Kaararka iyo bogga hore sawirka waa la jaraa si uu u buuxsho. Dooro qaybta sawirka ee had iyo jeer muuqanaysa, tusaale wejiga qofka.', options: [{label: 'Dhexda', value: center}, {label: 'Sare (wejiyada)', value: top}, {label: 'Hoose', value: bottom}, {label: 'Bidix', value: left}, {label: 'Midig', value: right}]}
      - {name: imageAlt, label: Sharaxaadda sawirka, widget: string, required: false}
      - {name: imageCredit, label: Sawirka waxaa leh, widget: string, required: false}
      - {name: imageLicense, label: Ruqsadda sawirka, widget: string, required: false}
      - {name: imageSourceUrl, label: Isha sawirka (link), widget: string, required: false}
      - {name: imageKind, label: Nooca sawirka, widget: select, required: false, options: [{label: 'Sawirka dhacdada', value: actual}, {label: 'Sawir muujin ah', value: illustrative}]}
      - {name: imageNote, label: Xusuus sawir, widget: string, required: false}
      - {name: source, label: Isha warka, widget: string, default: Wartabiye TV}
      - {name: sourceUrl, label: Link-ga isha, widget: string, required: false}
      - name: alsoReportedBy
        label: 'Ilo kale oo isla warkan qoray (Caalamka)'
        widget: list
        required: false
        hint: 'Hawsha wararka ayaa buuxisa marka dhowr ilood isla dhacdada qoraan: hal war oo keliya ayaa la daabacaa.'
        summary: '{{fields.source}}'
        fields:
          - {name: source, label: Isha, widget: string}
          - {name: url, label: Link, widget: string}
      - {name: worldSource, label: 'Isha Caalamka (id)', widget: string, required: false}
      - {name: timeVerified, label: Waqtiga waa la hubiyay, widget: boolean, default: true}
      - {name: discoveredAt, label: 'Goorta la helay (kormeeraha 5 daqiiqo; ha beddelin)', widget: string, required: false}
      - {name: verifiedAt, label: 'Goorta la hubiyay (hawsha wararka; ha beddelin)', widget: string, required: false}
      - {name: by, label: Qoraa, widget: hidden, default: admin}
      # translations: shown on the site when a visitor picks English, Arabic, French, Dutch, Italian, German or Turkish
      - name: en
        label: '🇬🇧 English (Ingiriisi)'
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.title}}'
        hint: 'Turjumaadda English (Ingiriisi). Hawsha wararka waxay buuxisaa oo kaliya turjumaad maqan; waligeed ma beddesho mid jirta. Si ay mar kale u turjunto, faaruqi cinwaanka. Bogga: ?lang=en'
        fields:
          - {name: title, label: 'Cinwaanka (EN)', widget: string, required: false}
          - {name: summary, label: 'Soo koobid (EN)', widget: text, required: false}
          - {name: body, label: 'Qoraalka buuxa (EN)', widget: text, required: false}
          - {name: imageAlt, label: 'Sharaxaadda sawirka (EN)', widget: string, required: false}
          - {name: status, label: 'Xaaladda (EN)', widget: select, default: manual, options: [{label: 'Gacan: adiga ayaa qoray / saxay', value: manual}, {label: 'Otomaatig (mashiin)', value: auto}], hint: 'Marka aad saxdo turjumaad otomaatig ah, dooro Gacan. Bogga wuxuu ka saarayaa calaamadda "si otomaatig ah ayaa loo turjumay".'}
          - {name: hash, label: Hash, widget: hidden}
