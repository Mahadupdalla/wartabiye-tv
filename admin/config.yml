# Wartabiye TV admin dashboard (Sveltia CMS).
# Login is GitHub: only accounts with write access to Mahadupdalla/wartabiye-tv can save.
# Nothing secret lives in this file.
backend:
  name: github
  repo: Mahadupdalla/wartabiye-tv
  branch: main
  # sign-in only with a GitHub access token (no third-party OAuth server)
  auth_methods: [token]
  commit_messages:
    create: 'Maamul: war cusub "{{slug}}"'
    update: 'Maamul: wax ka beddel "{{slug}}"'
    delete: 'Maamul: tirtir "{{slug}}"'
    uploadMedia: 'Maamul: sawir "{{path}}"'
    deleteMedia: 'Maamul: tirtir sawir "{{path}}"'

site_url: https://mahadupdalla.github.io/wartabiye-tv/
display_url: https://mahadupdalla.github.io/wartabiye-tv/
logo:
  src: ../img/logo.png

media_folder: img/news
public_folder: img/news
media_libraries:
  # no stock-photo sites: only images you upload yourself
  stock_assets: false
  default:
    config:
      max_file_size: 8000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: news
    label: Wararka
    label_singular: War
    description: Ku dar, beddel ama tirtir war. "La daabacay" dami si aad u kaydiso qabyo aan bogga ka muuqan.
    folder: data/news
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    # "View on live site" opens the article on the public site, drafts included; switch language there (top right)
    preview_path: '?preview={{filename}}'
    summary: '{{title}}'
    sortable_fields: [publishedAt, title, category]
    view_filters:
      - {label: Qabyo, field: published, pattern: false}
      - {label: Degdeg, field: breaking, pattern: true}
    fields:
      - {name: title, label: Cinwaanka, widget: string}
      - {name: summary, label: Soo koobid, widget: text}
      - {name: body, label: Qoraalka buuxa, widget: text, required: false, hint: 'Ikhtiyaari. Qoraal adiga kuu gaar ah; ha koobiyeyn qoraalka wargeysyada kale.'}
      - name: category
        label: Qaybta
        widget: relation
        collection: settings
        file: site
        search_fields: ['categories.*']
        value_field: 'categories.*'
        display_fields: ['categories.*']
      - {name: publishedAt, label: Taariikhda la daabacay, widget: datetime, format: 'YYYY-MM-DDTHH:mm:ssZ', default: '{{now}}'}
      - {name: published, label: La daabacay (bogga ka muuqda), widget: boolean, default: true}
      - {name: breaking, label: Degdeg (12 saac), widget: boolean, default: false}
      - {name: image, label: Sawirka, widget: image, choose_url: false, required: false, hint: 'Isticmaal sawir aad leedahay ama mid sharci ahaan la oggol yahay. Haddii aan sawir jirin, bogga wuxuu muujinayaa sawir-beddel.'}
      - {name: imageAlt, label: Sharaxaadda sawirka, widget: string, required: false}
      - {name: imageCredit, label: Sawirka waxaa leh, widget: string, required: false}
      - {name: imageLicense, label: Ruqsadda sawirka, widget: string, required: false}
      - {name: imageSourceUrl, label: Isha sawirka (link), widget: string, required: false}
      - {name: imageKind, label: Nooca sawirka, widget: select, required: false, options: [{label: 'Sawirka dhacdada', value: actual}, {label: 'Sawir muujin ah', value: illustrative}]}
      - {name: imageNote, label: Xusuus sawir, widget: string, required: false}
      - {name: source, label: Isha warka, widget: string, default: Wartabiye TV}
      - {name: sourceUrl, label: Link-ga isha, widget: string, required: false}
      - {name: timeVerified, label: Waqtiga waa la hubiyay, widget: boolean, default: true}
      - {name: by, label: Qoraa, widget: hidden, default: admin}
      # translations: shown on the site when a visitor picks English, Arabic or French
      - name: en
        label: '🇬🇧 English (Ingiriisi)'
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.title}}'
        hint: 'Turjumaadda English (Ingiriisi). Hawsha 06:00 waxay buuxisaa oo kaliya turjumaad maqan; waligeed ma beddesho mid jirta. Si ay mar kale u turjunto, faaruqi cinwaanka. Bogga: ?lang=en'
        fields:
          - {name: title, label: 'Cinwaanka (EN)', widget: string, required: false}
          - {name: summary, label: 'Soo koobid (EN)', widget: text, required: false}
          - {name: body, label: 'Qoraalka buuxa (EN)', widget: text, required: false}
          - {name: imageAlt, label: 'Sharaxaadda sawirka (EN)', widget: string, required: false}
          - {name: status, label: 'Xaaladda (EN)', widget: select, default: manual, options: [{label: 'Gacan: adiga ayaa qoray / saxay', value: manual}, {label: 'Otomaatig (mashiin)', value: auto}], hint: 'Marka aad saxdo turjumaad otomaatig ah, dooro Gacan. Bogga wuxuu ka saarayaa calaamadda "si otomaatig ah ayaa loo turjumay".'}
          - {name: hash, label: Hash, widget: hidden}
      - name: ar
        label: '🇸🇦 العربية (Carabi)'
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.title}}'
        hint: 'Turjumaadda العربية (Carabi). Hawsha 06:00 waxay buuxisaa oo kaliya turjumaad maqan; waligeed ma beddesho mid jirta. Si ay mar kale u turjunto, faaruqi cinwaanka. Bogga: ?lang=ar'
        fields:
          - {name: title, label: 'Cinwaanka (AR)', widget: string, required: false}
          - {name: summary, label: 'Soo koobid (AR)', widget: text, required: false}
          - {name: body, label: 'Qoraalka buuxa (AR)', widget: text, required: false}
          - {name: imageAlt, label: 'Sharaxaadda sawirka (AR)', widget: string, required: false}
          - {name: status, label: 'Xaaladda (AR)', widget: select, default: manual, options: [{label: 'Gacan: adiga ayaa qoray / saxay', value: manual}, {label: 'Otomaatig (mashiin)', value: auto}], hint: 'Marka aad saxdo turjumaad otomaatig ah, dooro Gacan. Bogga wuxuu ka saarayaa calaamadda "si otomaatig ah ayaa loo turjumay".'}
          - {name: hash, label: Hash, widget: hidden}
      - name: fr
        label: '🇫🇷 Français (Faransiis)'
        widget: object
        collapsed: true
        required: false
        summary: '{{fields.title}}'
        hint: 'Turjumaadda Français (Faransiis). Hawsha 06:00 waxay buuxisaa oo kaliya turjumaad maqan; waligeed ma beddesho mid jirta. Si ay mar kale u turjunto, faaruqi cinwaanka. Bogga: ?lang=fr'
        fields:
          - {name: title, label: 'Cinwaanka (FR)', widget: string, required: false}
          - {name: summary, label: 'Soo koobid (FR)', widget: text, required: false}
          - {name: body, label: 'Qoraalka buuxa (FR)', widget: text, required: false}
          - {name: imageAlt, label: 'Sharaxaadda sawirka (FR)', widget: string, required: false}
          - {name: status, label: 'Xaaladda (FR)', widget: select, default: manual, options: [{label: 'Gacan: adiga ayaa qoray / saxay', value: manual}, {label: 'Otomaatig (mashiin)', value: auto}], hint: 'Marka aad saxdo turjumaad otomaatig ah, dooro Gacan. Bogga wuxuu ka saarayaa calaamadda "si otomaatig ah ayaa loo turjumay".'}
          - {name: hash, label: Hash, widget: hidden}

  - name: settings
    label: Dejinta bogga
    editor:
      preview: false
    files:
      - name: site
        label: Bogga guud
        file: data/site.json
        format: json
        fields:
          - {name: city, label: Magaalada (xariijinta sare), widget: string}
          - {name: tagline, label: Hal-ku-dhegga hoos yimaada magaca, widget: string}
          - {name: about, label: Ku saabsan (footer), widget: text}
          - {name: motto, label: Halku-dhegga footer-ka (ku kala qaybi ·), widget: string}
          - name: categories
            label: Qaybaha
            widget: list
            field: {name: name, label: Qayb, widget: string}
          - name: nav
            label: Menu-ga (nav links)
            widget: list
            summary: '{{label}} → {{link}}'
            hint: 'Link-gu wuxuu noqon karaa #hoyga, #qayb-<qayb>, #barnaamijyada ama https://...'
            fields:
              - {name: label, label: Magaca, widget: string}
              - {name: link, label: Link, widget: string}
          - name: announcement
            label: Ogeysiis (xariijin buluug ah)
            widget: object
            fields:
              - {name: enabled, label: Muuji, widget: boolean, default: false}
              - {name: label, label: Calaamad, widget: string, default: OGEYSIIS}
              - {name: text, label: Qoraal, widget: string, required: false}
              - {name: link, label: Link, widget: string, required: false}
          - name: banner
            label: Banner (madaxa bogga)
            widget: object
            fields:
              - {name: enabled, label: Muuji, widget: boolean, default: false}
              - {name: label, label: Calaamad yar, widget: string, required: false}
              - {name: title, label: Cinwaan, widget: string, required: false}
              - {name: text, label: Qoraal, widget: string, required: false}
              - {name: image, label: Sawir, widget: image, choose_url: false, required: false}
              - {name: link, label: Link, widget: string, required: false}
          - name: breaking
            label: Degdeg (ticker)
            widget: object
            fields:
              - {name: mode, label: Habka, widget: select, options: [{label: 'Toos: wararka ugu dambeeyay + kuwan', value: auto}, {label: 'Gacan: kaliya kuwan hoose', value: manual}]}
              - {name: label, label: Calaamad, widget: string, default: DEGDEG}
              - name: items
                label: Qoraallo degdeg ah
                widget: list
                required: false
                fields:
                  - {name: text, label: Qoraal, widget: string}
                  - {name: en, label: 'Qoraal (English)', widget: string, required: false}
                  - {name: ar, label: 'Qoraal (العربية)', widget: string, required: false}
                  - {name: fr, label: 'Qoraal (Français)', widget: string, required: false}
                  - {name: link, label: Link, widget: string, required: false}
          - name: featured
            label: Wararka la soo xulay (kan koowaad waa kan weyn)
            widget: relation
            collection: news
            search_fields: [title]
            value_field: '{{slug}}'
            display_fields: [title]
            multiple: true
            required: false
          - name: sections
            label: Qaybaha bogga hore (shid/dami)
            widget: object
            fields:
              - {name: featured, label: Wararka waaweyn (sare), widget: boolean, default: true}
              - {name: latest, label: Wararka cusub (liiska), widget: boolean, default: true}
              - {name: sidebar, label: Dhinaca (sidebar), widget: boolean, default: true}
              - {name: sidebarLatest, label: Ugu dambeeyay (sidebar), widget: boolean, default: true}
              - {name: programmes, label: Barnaamijyada, widget: boolean, default: true}
              - {name: footerLatest, label: Wararka footer-ka, widget: boolean, default: true}
          - {name: programmesTitle, label: Cinwaanka Barnaamijyada, widget: string}
          - {name: programmesSubtitle, label: Qoraal yar oo Barnaamijyada, widget: string}
          - name: programmes
            label: Barnaamijyada
            widget: list
            fields:
              - {name: title, label: Magac, widget: string}
              - {name: text, label: Sharaxaad, widget: string}
              - {name: when, label: Goorta, widget: string}
          # translations of the texts above (the site switches with the language selector)
          - name: en
            label: '🇬🇧 English'
            widget: object
            collapsed: true
            required: false
            hint: 'Qoraallada bogga ee English. Meel banaan = qoraalka Soomaaliga ayaa muuqda. Menu-ga iyo qaybaha (Siyaasadda…) si toos ah ayaa loo turjumaa.'
            fields:
              - {name: city, label: 'Magaalada (EN)', widget: string, required: false}
              - {name: tagline, label: 'Hal-ku-dhegga (EN)', widget: string, required: false}
              - {name: about, label: 'Ku saabsan (EN)', widget: text, required: false}
              - {name: motto, label: 'Halku-dhegga footer-ka (EN)', widget: string, required: false}
              - {name: announcementLabel, label: 'Ogeysiis: calaamad (EN)', widget: string, required: false}
              - {name: announcementText, label: 'Ogeysiis: qoraal (EN)', widget: string, required: false}
              - {name: bannerLabel, label: 'Banner: calaamad (EN)', widget: string, required: false}
              - {name: bannerTitle, label: 'Banner: cinwaan (EN)', widget: string, required: false}
              - {name: bannerText, label: 'Banner: qoraal (EN)', widget: string, required: false}
              - {name: breakingLabel, label: 'Degdeg: calaamad (EN)', widget: string, required: false}
              - {name: programmesTitle, label: 'Cinwaanka Barnaamijyada (EN)', widget: string, required: false}
              - {name: programmesSubtitle, label: 'Qoraal yar Barnaamijyada (EN)', widget: string, required: false}
              - name: programmes
                label: 'Barnaamijyada (EN), isla kala horreynta Soomaaliga'
                widget: list
                required: false
                fields:
                  - {name: title, label: Magac, widget: string}
                  - {name: text, label: Sharaxaad, widget: string, required: false}
                  - {name: when, label: Goorta, widget: string, required: false}
              - name: categories
                label: 'Magacyada qaybaha cusub (EN)'
                widget: list
                required: false
                hint: 'Kaliya haddii aad qayb cusub ku darto. Lixda qaybood ee hadda jira si toos ah ayaa loo turjumaa.'
                fields:
                  - {name: so, label: Qaybta (Soomaali), widget: string}
                  - {name: name, label: Magaca la turjumay, widget: string}
          - name: ar
            label: '🇸🇦 العربية'
            widget: object
            collapsed: true
            required: false
            hint: 'Qoraallada bogga ee العربية. Meel banaan = qoraalka Soomaaliga ayaa muuqda. Menu-ga iyo qaybaha (Siyaasadda…) si toos ah ayaa loo turjumaa.'
            fields:
              - {name: city, label: 'Magaalada (AR)', widget: string, required: false}
              - {name: tagline, label: 'Hal-ku-dhegga (AR)', widget: string, required: false}
              - {name: about, label: 'Ku saabsan (AR)', widget: text, required: false}
              - {name: motto, label: 'Halku-dhegga footer-ka (AR)', widget: string, required: false}
              - {name: announcementLabel, label: 'Ogeysiis: calaamad (AR)', widget: string, required: false}
              - {name: announcementText, label: 'Ogeysiis: qoraal (AR)', widget: string, required: false}
              - {name: bannerLabel, label: 'Banner: calaamad (AR)', widget: string, required: false}
              - {name: bannerTitle, label: 'Banner: cinwaan (AR)', widget: string, required: false}
              - {name: bannerText, label: 'Banner: qoraal (AR)', widget: string, required: false}
              - {name: breakingLabel, label: 'Degdeg: calaamad (AR)', widget: string, required: false}
              - {name: programmesTitle, label: 'Cinwaanka Barnaamijyada (AR)', widget: string, required: false}
              - {name: programmesSubtitle, label: 'Qoraal yar Barnaamijyada (AR)', widget: string, required: false}
              - name: programmes
                label: 'Barnaamijyada (AR), isla kala horreynta Soomaaliga'
                widget: list
                required: false
                fields:
                  - {name: title, label: Magac, widget: string}
                  - {name: text, label: Sharaxaad, widget: string, required: false}
                  - {name: when, label: Goorta, widget: string, required: false}
              - name: categories
                label: 'Magacyada qaybaha cusub (AR)'
                widget: list
                required: false
                hint: 'Kaliya haddii aad qayb cusub ku darto. Lixda qaybood ee hadda jira si toos ah ayaa loo turjumaa.'
                fields:
                  - {name: so, label: Qaybta (Soomaali), widget: string}
                  - {name: name, label: Magaca la turjumay, widget: string}
          - name: fr
            label: '🇫🇷 Français'
            widget: object
            collapsed: true
            required: false
            hint: 'Qoraallada bogga ee Français. Meel banaan = qoraalka Soomaaliga ayaa muuqda. Menu-ga iyo qaybaha (Siyaasadda…) si toos ah ayaa loo turjumaa.'
            fields:
              - {name: city, label: 'Magaalada (FR)', widget: string, required: false}
              - {name: tagline, label: 'Hal-ku-dhegga (FR)', widget: string, required: false}
              - {name: about, label: 'Ku saabsan (FR)', widget: text, required: false}
              - {name: motto, label: 'Halku-dhegga footer-ka (FR)', widget: string, required: false}
              - {name: announcementLabel, label: 'Ogeysiis: calaamad (FR)', widget: string, required: false}
              - {name: announcementText, label: 'Ogeysiis: qoraal (FR)', widget: string, required: false}
              - {name: bannerLabel, label: 'Banner: calaamad (FR)', widget: string, required: false}
              - {name: bannerTitle, label: 'Banner: cinwaan (FR)', widget: string, required: false}
              - {name: bannerText, label: 'Banner: qoraal (FR)', widget: string, required: false}
              - {name: breakingLabel, label: 'Degdeg: calaamad (FR)', widget: string, required: false}
              - {name: programmesTitle, label: 'Cinwaanka Barnaamijyada (FR)', widget: string, required: false}
              - {name: programmesSubtitle, label: 'Qoraal yar Barnaamijyada (FR)', widget: string, required: false}
              - name: programmes
                label: 'Barnaamijyada (FR), isla kala horreynta Soomaaliga'
                widget: list
                required: false
                fields:
                  - {name: title, label: Magac, widget: string}
                  - {name: text, label: Sharaxaad, widget: string, required: false}
                  - {name: when, label: Goorta, widget: string, required: false}
              - name: categories
                label: 'Magacyada qaybaha cusub (FR)'
                widget: list
                required: false
                hint: 'Kaliya haddii aad qayb cusub ku darto. Lixda qaybood ee hadda jira si toos ah ayaa loo turjumaa.'
                fields:
                  - {name: so, label: Qaybta (Soomaali), widget: string}
                  - {name: name, label: Magaca la turjumay, widget: string}
