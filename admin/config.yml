  - name: world
    label: 'Wararka Caalamka: xaaladda iyo ilaha'
    description: 'Siddeeda ilood ee Wararka Caalamka. "Xaaladda" waxaa qora hawsha wararka (08:00 iyo 18:00) orod kasta: ilaha shaqeeya, tirada wararka la ururiyay, nuqullada la saaray, kuwa sugaya sawir iyo khaladaadka. War gaar ah wax ka beddel, tirtir ama qabyo ka dhig qaybta Wararka (filter: Caalamka / Sugaya sawir).'
    editor:
      preview: false
    files:
      - name: status
        label: 'Xaaladda cusbooneysiintii u dambeysay (waxaa qora hawsha, ha beddelin)'
        file: data/world/status.json
        format: json
        fields:
          - {name: lastRunAt, label: 'Orodkii u dambeeyay', widget: string, required: false}
          - {name: lastSuccessAt, label: 'Cusbooneysiintii u dambeysay ee guulaysatay', widget: string, required: false}
          - name: lastRun
            label: 'Orodkii u dambeeyay: tirooyinka'
            widget: object
            required: false
            fields:
              - {name: collected, label: 'Wararka la ururiyay (dhammaan ilaha)', widget: number, required: false}
              - {name: duplicatesRemoved, label: 'Nuqullada la saaray', widget: number, required: false}
              - {name: alreadyKnown, label: 'Horey bogga ugu jiray (ama aad tirtirtay)', widget: number, required: false}
              - {name: published, label: 'Warar cusub oo la daabacay', widget: number, required: false}
              - {name: pendingImage, label: 'Sugaya sawir', widget: number, required: false}
              - {name: pendingIds, label: 'Wararka sugaya sawir (id)', widget: list, required: false}
              - {name: imageErrors, label: 'Khaladaadka sawirrada', widget: list, required: false}
              - {name: errors, label: 'Khaladaad kale', widget: list, required: false}
          - name: sources
            label: 'Ilaha (orodkii u dambeeyay)'
            widget: list
            required: false
            summary: '{{fields.name}}: {{fields.collected}} la ururiyay, {{fields.published}} la daabacay'
            fields:
              - {name: name, label: Isha, widget: string}
              - {name: homepage, label: Website, widget: string, required: false}
              - {name: working, label: 'Way shaqeysaa', widget: boolean, required: false}
              - {name: method, label: 'Habka (RSS / sitemap / bog)', widget: string, required: false}
              - {name: collected, label: 'La ururiyay', widget: number, required: false}
              - {name: duplicates, label: 'Nuqul', widget: number, required: false}
              - {name: published, label: 'La daabacay', widget: number, required: false}
              - {name: pendingImage, label: 'Sugaya sawir', widget: number, required: false}
              - {name: errors, label: 'Khalad', widget: text, required: false}
          - name: history
            label: 'Taariikhda orodyada (30 kii u dambeeyay)'
            widget: list
            required: false
            summary: '{{fields.at}}: {{fields.collected}} la ururiyay, {{fields.duplicatesRemoved}} nuqul, {{fields.published}} la daabacay, {{fields.pendingImage}} sugaya sawir'
            fields:
              - {name: at, label: Waqtiga, widget: string}
              - {name: ok, label: Guul, widget: boolean, required: false}
              - {name: collected, label: 'La ururiyay', widget: number, required: false}
              - {name: duplicatesRemoved, label: Nuqul, widget: number, required: false}
              - {name: published, label: 'La daabacay', widget: number, required: false}
              - {name: pendingImage, label: 'Sugaya sawir', widget: number, required: false}
      - name: sources
        label: 'Ilaha (dami "Shaqeyso" si aad isha u joojiso)'
        file: data/world/sources.json
        format: json
        fields:
          - {name: note, label: Xusuus, widget: text, required: false}
          - name: perSource
