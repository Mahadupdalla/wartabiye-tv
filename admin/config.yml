    description: 'Baahinta tooska ah ee rasmiga ah, jadwalka baahinta, adeegga natiijooyinka ciyaaraha iyo baahinta ciyaaraha ee xuquuqdeeda la haysto. Waxba halkan kuma qor oo sir ah (API key, password): furayaasha waxay galaan GitHub Secrets ama Cloudflare (eeg HAGAHA-MAAMULKA.md).'
