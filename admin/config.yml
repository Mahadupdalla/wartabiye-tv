  - name: notify
    label: 'Ogeysiisyada: Settings, xaaladda dirista iyo jadwalka wararka'
    description: 'Shid ama dami push, xaddid inta jeer ee la dirayo, eeg ogeysiisyada la diray iyo jadwalka saacadlaha ah. Waxba halkan kuma qor oo sir ah: furaha qarsoon wuxuu ku jiraa Cloudflare iyo GitHub Secrets (eeg HAGAHA-MAAMULKA.md → Ogeysiisyada).'
    editor:
      preview: false
    files:
      - name: settings
        label: 'Settings-ka push'
        file: data/notify-settings.json
        format: json
        fields:
          - {name: pushEnabled, label: 'Push waa shidan yahay', widget: boolean, default: false, hint: 'Dami si aad u joojiso dhammaan push-ka (gambaleelka bogga wuu sii shaqeynayaa).'}
          - {name: workerUrl, label: 'Cinwaanka adeegga push (Cloudflare Worker)', widget: string, required: false, hint: 'Tusaale: https://wartabiye-push.<magacaaga>.workers.dev (eeg workers/push/README.md).'}
          - {name: publicKey, label: 'VAPID public key (furaha guud, sir ma aha)', widget: string, required: false, hint: 'Waxaa sameeya `node workers/push/make-keys.mjs`. Furaha QARSOON halkan ha gelin.'}
          - name: categories
            label: 'Qaybaha la diri karo'
            widget: object
            fields:
              - {name: breaking, label: 'Degdeg (Breaking News)', widget: boolean, default: true}
              - {name: eastAfrica, label: 'Bariga Afrika', widget: boolean, default: true}
              - {name: world, label: Caalamka, widget: boolean, default: true}
              - {name: sports, label: Ciyaaraha, widget: boolean, default: true}
              - {name: live, label: 'LIVE TV (marka baahinta la xaqiijiyo)', widget: boolean, default: true}
          - {name: maxRoutinePerDay, label: 'Push caadi ah: ugu badnaan maalintii', widget: number, value_type: int, min: 0, max: 24, default: 6}
          - {name: minMinutesBetweenRoutine, label: 'Push caadi ah: ugu yaraan daqiiqado u dhexeeya', widget: number, value_type: int, min: 30, max: 1440, default: 90}
          - {name: maxBreakingPerDay, label: 'Degdeg: ugu badnaan maalintii', widget: number, value_type: int, min: 0, max: 12, default: 4}
          - {name: maxAgeHours, label: 'War ka da''weyn (saacado) push looma diro', widget: number, value_type: int, min: 1, max: 24, default: 6}
          - name: quietHours
            label: 'Saacadaha aamusnaanta (push caadi ah lama diro; Degdeg waa la diraa)'
            widget: object
            fields:
              - {name: enabled, label: Shidan, widget: boolean, default: true}
              - {name: from, label: 'Laga bilaabo (saacad, EAT)', widget: number, value_type: int, min: 0, max: 23, default: 23}
              - {name: to, label: 'Ilaa (saacad, EAT)', widget: number, value_type: int, min: 0, max: 23, default: 6}
      - name: schedule
        label: 'Jadwalka wararka (hawsha saacadlaha ah)'
        file: data/schedule.json
        format: json
        fields:
          - {name: hourly, label: 'Saacad kasta (24/7) hubi wararka cusub', widget: boolean, default: true, hint: 'Shidan: hawsha Claude waxay hubisaa saacad kasta, 24 saac (Africa/Nairobi, 24 jeer maalintii, habeen iyo maalin). Dansan: kaliya 08:00 iyo 18:00 ayay shaqeysaa; orodyada kale isla markiiba way joogsadaan (wax ma qoraan). Jadwalka hawsha laftiisa waxaa laga beddelaa claude.ai → Scheduled tasks.'}
          - {name: note, label: Xusuus, widget: text, required: false}
      - name: log
        label: 'Xaaladda dirista (waxaa qora GitHub Actions, ha beddelin)'
        file: data/push-log.json
        format: json
        fields:
          - name: lastRun
            label: 'Orodkii u dambeeyay'
            widget: object
            required: false
            fields:
              - {name: at, label: Waqtiga, widget: string, required: false}
              - {name: mode, label: 'Nooca (news / live)', widget: string, required: false}
              - {name: sent, label: 'Ogeysiisyo la diray', widget: number, required: false}
              - {name: pushEnabled, label: 'Push wuu shidnaa', widget: boolean, required: false}
              - {name: configured, label: 'Adeegga iyo furaha waa diyaar', widget: boolean, required: false}
              - name: skipped
                label: 'Lama dirin (sababta)'
                widget: list
                required: false
                summary: '{{fields.id}}: {{fields.why}}'
                fields:
                  - {name: id, label: Ogeysiis, widget: string}
                  - {name: why, label: Sababta, widget: string}
          - name: subscribers
            label: 'Dadka ogeysiisyada shitay'
            widget: object
            required: false
            fields:
              - {name: total, label: Wadar, widget: number, required: false}
              - {name: breaking, label: Degdeg, widget: number, required: false}
              - {name: eastAfrica, label: 'Bariga Afrika', widget: number, required: false}
              - {name: world, label: Caalamka, widget: number, required: false}
              - {name: sports, label: Ciyaaraha, widget: number, required: false}
              - {name: live, label: 'LIVE TV', widget: number, required: false}
          - name: sent
            label: 'Ogeysiisyadii la diray (100 kii u dambeeyay)'
            widget: list
            required: false
            summary: '{{fields.at}} · {{fields.category}} · {{fields.title}}'
            fields:
              - {name: at, label: Waqtiga, widget: string}
              - {name: id, label: Id, widget: string}
              - {name: category, label: Qaybta, widget: string}
              - {name: urgent, label: Degdeg, widget: boolean, required: false}
              - {name: title, label: Cinwaanka, widget: string}
              - {name: url, label: Link, widget: string}
              - name: result
                label: Natiijada
                widget: object
                fields:
                  - {name: ok, label: Guul, widget: boolean, required: false}
                  - {name: matched, label: 'Dadka loo diray', widget: number, required: false}
                  - {name: sent, label: 'La gaarsiiyay', widget: number, required: false}
                  - {name: failed, label: 'Khalad', widget: number, required: false}
                  - {name: removed, label: 'La saaray (is-diiwaangelin dhacday)', widget: number, required: false}
                  - {name: error, label: 'Khaladka', widget: string, required: false}
