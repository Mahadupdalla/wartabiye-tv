  - name: settings
    label: Dejinta bogga
    editor:
      preview: false
    files:
      - name: site
        label: Bogga guud
        file: data/site.json
        format: json
        fields:
          - {name: city, label: Magaalada (xariijinta sare), widget: string}
          - {name: tagline, label: Hal-ku-dhegga hoos yimaada magaca, widget: string}
          - {name: about, label: Ku saabsan (footer), widget: text}
          - {name: motto, label: Halku-dhegga footer-ka (ku kala qaybi ·), widget: string}
          - name: categories
            label: Qaybaha
            widget: list
            field: {name: name, label: Qayb, widget: string}
          - name: nav
            label: Menu-ga (nav links)
            widget: list
            summary: '{{label}} → {{link}}'
            hint: 'Link-gu wuxuu noqon karaa #hoyga, #qayb-<qayb>, #barnaamijyada ama https://...'
            fields:
              - {name: label, label: Magaca, widget: string}
              - {name: link, label: Link, widget: string}
          - name: announcement
            label: Ogeysiis (xariijin buluug ah)
            widget: object
            fields:
              - {name: enabled, label: Muuji, widget: boolean, default: false}
              - {name: label, label: Calaamad, widget: string, default: OGEYSIIS}
              - {name: text, label: Qoraal, widget: string, required: false}
              - {name: link, label: Link, widget: string, required: false}
          - name: banner
            label: Banner (madaxa bogga)
            widget: object
            fields:
              - {name: enabled, label: Muuji, widget: boolean, default: false}
              - {name: style, label: Nooca banner-ka, widget: select, required: false, options: [{label: 'Calanka iyo Xornimada Soomaaliya', value: calan}, {label: 'Banner caadi ah (sawir iyo qoraal)', value: 'caadi'}]}
              - {name: label, label: Calaamad yar, widget: string, required: false}
              - {name: title, label: Cinwaan, widget: string, required: false}
              - {name: text, label: Qoraal, widget: string, required: false}
              - {name: image, label: Sawir, widget: image, choose_url: false, required: false}
              - {name: link, label: Link, widget: string, required: false}
          - name: breaking
            label: Degdeg (ticker)
            widget: object
            fields:
              - {name: mode, label: Habka, widget: select, options: [{label: 'Toos: wararka ugu dambeeyay + kuwan', value: auto}, {label: 'Gacan: kaliya kuwan hoose', value: manual}]}
              - {name: label, label: Calaamad, widget: string, default: DEGDEG}
              - name: items
                label: Qoraallo degdeg ah
                widget: list
                required: false
                fields:
                  - {name: text, label: Qoraal, widget: string}
                  - {name: en, label: 'Qoraal (English)', widget: string, required: false}
                  - {name: ar, label: 'Qoraal (العربية)', widget: string, required: false}
                  - {name: fr, label: 'Qoraal (Français)', widget: string, required: false}
                  - {name: nl, label: 'Qoraal (Nederlands)', widget: string, required: false}
                  - {name: it, label: 'Qoraal (Italiano)', widget: string, required: false}
                  - {name: de, label: 'Qoraal (Deutsch)', widget: string, required: false}
                  - {name: tr, label: 'Qoraal (Türkçe)', widget: string, required: false}
                  - {name: es, label: 'Qoraal (Español)', widget: string, required: false}
                  - {name: link, label: Link, widget: string, required: false}
          - name: featured
            label: Wararka la soo xulay (kan koowaad waa kan weyn)
            widget: relation
            collection: news
            search_fields: [title]
            value_field: '{{slug}}'
            display_fields: [title]
            multiple: true
            required: false
          - name: trending
            label: 'Muhiim hadda (doorashada tifaftirka)'
            hint: 'Haddii aad warar doorato, kuwan ayaa ugu horreeya liiska "Muhiim hadda". Haddii kale: degdeg, warar "Muhiim" ah iyo kan ugu dambeeya qayb kasta.'
            widget: relation
            collection: news
            search_fields: [title]
            value_field: '{{slug}}'
            display_fields: [title]
            multiple: true
            required: false
          - name: social
            label: Baraha bulshada (links)
            widget: object
            fields:
              - {name: facebook, label: Facebook, widget: string, required: false}
              - {name: tiktok, label: TikTok, widget: string, required: false}
              - {name: youtube, label: YouTube, widget: string, required: false}
          - name: forms
            label: 'Foomamka (Nala Soo Xiriir, Codsiga xayeysiiska)'
            widget: object
            hint: 'Fariimaha foomamka si qarsoodi ah ayaa email-kaaga loogu soo diraa (Web3Forms, bilaash). Furaha (access key) waxaa laga helaa web3forms.com. Furahan sir ma aha: wuxuu kaliya u oggol yahay in fariin email-kaaga loo diro.'
            fields:
