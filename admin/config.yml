        file: data/sports.json
        format: json
        fields:
          - {name: apiBase, label: 'Cinwaanka adeegga xogta ciyaaraha (https://...workers.dev)', widget: string, required: false, hint: 'Cinwaanka proxy-ga Wartabiye (workers/sports-api). API key-ga HALKAN HA KU QORIN: wuxuu galaa Cloudflare secret.'}
          - {name: providerName, label: 'Magaca bixiyaha xogta (tusaale football-data.org)', widget: string, required: false}
          - {name: refreshSeconds, label: 'Cusbooneysiin kasta (ilbiriqsi, ugu yaraan 30)', widget: number, value_type: int, min: 30, default: 60}
          - name: openData
            label: 'Xog furan oo bilaash ah (OpenLigaDB, key looma baahna)'
            widget: object
            required: false
            hint: 'OpenLigaDB waa kayd xog kubadda cagta oo furan oo qof kasta isticmaali karo. Natiijooyinka tooska ah, goolasha, ciyaaraha soo socda iyo kala sarreynta ayuu bixiyaa. Julaay kasta "Xilliga" cusboonaysii (tusaale 2027).'
            fields:
              - {name: enabled, label: 'Shid', widget: boolean, default: true}
              - {name: provider, label: Bixiyaha, widget: hidden, default: OpenLigaDB}
              - name: leagues
                label: Horyaallada
                widget: list
                summary: '{{name}} ({{id}} {{season}})'
                fields:
                  - {name: id, label: 'Gaaban-ka OpenLigaDB (tusaale bl1, ucl, uel2026)', widget: string}
                  - {name: season, label: 'Xilliga (sannadka uu bilaabmay, tusaale 2026)', widget: number, value_type: int}
                  - {name: name, label: Magaca, widget: string}
                  - {name: same, label: 'Isla tartankaas ee football-data.org (tusaale BL1), si aan laba jeer loo muujin', widget: string, required: false}
                  - {name: enabled, label: Muuji, widget: boolean, default: true}
          - name: competitions
            label: 'Tartamada (football-data.org: GitHub secret FOOTBALL_DATA_TOKEN ama proxy-ga)'
            widget: list
            summary: '{{name}} ({{id}})'
            fields:
              - {name: id, label: 'ID-ga tartanka ee bixiyaha (tusaale PL, 39)', widget: string}
              - {name: name, label: Magaca, widget: string}
          - name: viewingInfo
            label: 'Halkee lagu daawan karaa (macluumaadka rasmiga ah)'
            widget: list
            required: false
            summary: '{{competition}}'
            fields:
              - {name: competition, label: Tartanka, widget: string}
              - {name: text, label: Qoraal, widget: string}
              - {name: url, label: 'Link rasmi ah (https://)', widget: string, required: false}
          - name: streams
            label: 'Baahinta ciyaaraha (KALIYA marka xuquuqda la haysto)'
            widget: list
            required: false
            summary: '{{title}} · {{rightsHolder}}'
            hint: 'Ciyaar kasta waxay muuqanaysaa kaliya marka "Xuquuqda waa la xaqiijiyay" la shido, cidda xuquuqda leh la qoro, iyo oggolaanshaha la qoro. Waligaa ha gelin baahin la xaday ama dib-u-baahin aan oggolaansho lahayn.'
            fields:
              - {name: title, label: Ciyaarta, widget: string}
              - {name: matchId, label: 'ID-ga ciyaarta ee bixiyaha xogta (ikhtiyaari)', widget: string, required: false}
              - {name: url, label: 'Link-ga baahinta (YouTube, Vimeo, Cloudflare Stream, .m3u8 …)', widget: string}
              - {name: start, label: Bilowga, widget: datetime}
              - {name: end, label: Dhammaadka, widget: datetime}
              - {name: rightsHolder, label: 'Cidda xuquuqda baahinta leh', widget: string}
              - {name: authorization, label: 'Oggolaanshaha (lambarka heshiiska / warqadda oggolaanshaha / taariikhda)', widget: string}
              - {name: rightsConfirmed, label: 'Waxaan xaqiijinayaa in Wartabiye TV haysato xuquuqda ama oggolaansho qoran oo lagu baahiyo bogga', widget: boolean, default: false}
              - {name: published, label: Muuji, widget: boolean, default: true}
      - name: sources
        label: 'Ilaha Muuqaallada iyo Wararka Tooska (otomaatig)'
        file: data/media-sources.json
        format: json
        fields:
          - name: videos
            label: Muuqaallada (VIDEO NEWS)
            widget: object
            hint: 'Kanaalada YouTube ee rasmiga ah iyo RSS-ka wakaaladaha wararka. Hawsha "Live feeds" (5 daqiiqo kasta) ayaa iyaga ka soo qaada muuqaallada cusub iyo cinwaannada. Kaliya muuqaallada YouTube u oggolaatay in la geliyo (embed) ayaa la muujiyaa. Xaaladda ilaha: https://www.wartabiyetv.com/#ilaha-xaaladda'
            fields:
              - {name: maxPerChannel, label: 'Ugu badnaan muuqaal kanaal kasta', widget: number, value_type: int, min: 1, max: 20, default: 8}
              - {name: maxAgeDays, label: 'Muuqaallada ka da'' weyn (maalmo) lama muujiyo', widget: number, value_type: int, min: 1, max: 30, default: 7}
              - {name: skipShorts, label: 'Ka saar YouTube Shorts', widget: boolean, default: true}
              - name: channels
                label: Kanaalada rasmiga ah
                widget: list
                summary: '{{name}} ({{language}})'
                fields:
                  - {name: name, label: Magaca, widget: string}
                  - {name: channelId, label: 'YouTube channel ID (UC...)', widget: string, pattern: ['^UC[A-Za-z0-9_-]{22}$', 'ID-gu wuxuu ku bilaabmaa UC, 24 xaraf']}
                  - {name: language, label: Luqadda, widget: select, default: en, options: [so, en, ar, fr, nl, it, de, tr, es]}
                  - {name: kind, label: Nooca, widget: select, default: world, options: [somalia, world, sports]}
                  - {name: enabled, label: Shid, widget: boolean, default: true}
          - name: liveChannels
            label: 'Kanaalada tooska ah ee rasmiga ah (LIVE News)'
            widget: list
            hint: 'Ciyaartoyga rasmiga ah ee YouTube ayaa la isticmaalaa. Bogga ma qoro "LIVE" isagoo aan hubin; YouTube ayaa muujinaya haddii kanaalku hadda baahinayo.'
            summary: '{{name}}'
            fields:
              - {name: name, label: Magaca, widget: string}
              - {name: channelId, label: 'YouTube channel ID (UC...)', widget: string, pattern: ['^UC[A-Za-z0-9_-]{22}$', 'ID-gu wuxuu ku bilaabmaa UC, 24 xaraf']}
              - {name: language, label: Luqadda, widget: select, default: en, options: [so, en, ar, fr, nl, it, de, tr, es]}
              - {name: enabled, label: Shid, widget: boolean, default: true}
          - name: wire
            label: 'Wararka tooska ah ee wakaaladaha (RSS rasmi ah)'
            widget: object
            fields:
              - {name: maxAgeHours, label: 'Cinwaannada ka da'' weyn (saacado) lama muujiyo', widget: number, value_type: int, min: 1, max: 72, default: 24}
              - {name: maxItems, label: 'Ugu badnaan cinwaanno', widget: number, value_type: int, min: 10, max: 300, default: 120}
              - name: feeds
                label: Ilaha RSS
                widget: list
                summary: '{{name}} · {{region}}'
                fields:
                  - {name: id, label: 'ID gaaban (xarfo yaryar, tusaale bbc-somali)', widget: string, pattern: ['^[a-z0-9-]{2,30}$', 'xarfo yaryar, tirooyin iyo -']}
                  - {name: name, label: Magaca ilaha, widget: string}
                  - {name: url, label: 'Link-ga RSS-ka rasmiga ah (https://)', widget: string, pattern: ['^https://', 'waa inuu ku bilaabmaa https://']}
                  - {name: region, label: Gobolka, widget: select, default: world, options: [somalia, eastafrica, africa, world]}
                  - {name: language, label: Luqadda, widget: select, default: en, options: [so, en, ar, fr, nl, it, de, tr, es]}
                  - {name: enabled, label: Shid, widget: boolean, default: true}
  - name: alerts
    label: 'Ogeysiisyada (gambaleelka iyo push)'
    label_singular: Ogeysiis
    description: 'Samee ogeysiis gacmeed ama Degdeg (Breaking News). Wuxuu ka muuqanayaa gambaleelka bogga, haddii "Push" shidan yahay waxaa loo dirayaa dadka ogeysiisyada shitay. Ogeysiis kasta waa inuu ku xirnaadaa war la daabacay ama bog ka mid ah bogga (LIVE TV, Ciyaaraha Toos …); haddii warku qabyo yahay lama dirayo. Wararka cusub ee hawsha saacadlaha ah si toos ah ayay u galaan gambaleelka; halkan looma baahna.'
    folder: data/alerts
    extension: json
    format: json
    create: true
    delete: true
