          - {name: status, label: 'Xaaladda (AR)', widget: select, default: manual, options: [{label: 'Gacan: adiga ayaa qoray / saxay', value: manual}, {label: 'Otomaatig (mashiin)', value: auto}], hint: 'Marka aad saxdo turjumaad otomaatig ah, dooro Gacan. Bogga wuxuu ka saarayaa calaamadda "si otomaatig ah ayaa loo turjumay".'}
