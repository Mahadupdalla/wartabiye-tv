name: Jadwalka daabacaadda (scheduled articles from the admin)
# Publishes the articles the owner scheduled in /admin/ (Articles → Schedule) once their time has come. Touches only
# articles that carry "publishAt"; then starts the normal publishing workflow (a push made with this job's token does
# not start it by itself).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scheduled-publish
jobs:
  due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Publish the articles whose time has come
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scheduled_publish.py test >/dev/null
          ids=$(python3 tools/scheduled_publish.py)
          if [ -z "$ids" ]; then echo "nothing scheduled for now"; exit 0; fi
          echo "$ids"
          git add data/news
          git -c user.name=wartabiye-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Jadwal: $(echo $ids | wc -w) war la daabacay"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((2**i)); done
          gh workflow run publish.yml --ref main
