name: Games online rooms (deploy)
# Tests and deploys workers/games (Cloudflare Workers + Durable Objects, free plan): private rooms with a code so friends
# can play Four Homes together. Uses the same two repository secrets as admin-deploy.yml (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID); nothing new to add. Then it tells the website where the room server is (data/games-online.json).
on:
  push:
    branches: [main]
    paths: ['workers/games/**', '.github/workflows/games-deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: games-deploy
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workers/games } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - name: Tests (private rooms, origin check, host-only state, fixed reactions, reconnect)
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: workers/games } }
    steps:
      - name: Cloudflare account connected?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CF_ACCOUNT_SECRET" ]; then
            echo "::notice::Online games not deployed: add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (workers/admin/README.md), then run this workflow again."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ready == 'yes'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'yes'
        with: { node-version: '22' }
      - name: Install
        if: steps.cf.outputs.ready == 'yes'
        run: npm ci --no-audit --no-fund
      - name: Cloudflare account check
        if: steps.cf.outputs.ready == 'yes'
        run: |
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          given=$(printf '%s' "$CF_ACCOUNT_SECRET" | tr -d '[:space:]"')
          accts=$(cf "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          if [ "$(echo "$accts" | jq -r '.success')" != true ]; then
            echo "Cloudflare said: $(echo "$accts" | jq -c '.errors')"
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not accepted by Cloudflare."; exit 1
          fi
          ids=$(echo "$accts" | jq -r '.result[].id')
          if echo "$ids" | grep -qx "$given"; then id=$given
          elif [ "$(echo "$ids" | grep -c .)" = 1 ]; then id=$ids; echo "::warning::using the token's only account"
          else echo "::error::CLOUDFLARE_ACCOUNT_ID does not match any account of this token."; exit 1; fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
      - name: Deploy
        if: steps.cf.outputs.ready == 'yes'
        id: deploy
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::no workers.dev address in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check it is live and closed to other websites
        if: steps.cf.outputs.ready == 'yes'
        env: { URL: '${{ steps.deploy.outputs.url }}' }
        run: |
          ok=; for i in $(seq 1 40); do if curl -fsS -m 15 -o health.json "$URL/health"; then ok=1; break; fi; sleep 15; done
          [ -n "$ok" ] || { echo "::error::$URL is not reachable after 10 minutes"; exit 1; }
          jq -e '.ok == true' health.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' "$URL/new"); echo "room from another site: $code"; [ "$code" = 403 ]
          curl -fsS -X POST -H 'Origin: https://www.wartabiyetv.com' "$URL/new" | jq -e '.code | test("^[A-Z2-9]{6}$")'
      - name: Tell the website where the room server is
        if: steps.cf.outputs.ready == 'yes'
        working-directory: .
        env:
          URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in 2 4 8 16 0; do
            git pull -q --rebase origin main || true
            printf '{\n "url": "%s",\n "note": "Online rooms for games (workers/games). Written by games-deploy.yml."\n}\n' "$URL" > data/games-online.json
            git add data/games-online.json
            if git diff --cached --quiet; then echo "website already points at $URL"; exit 0; fi
            git config user.name "wartabiye-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Ciyaaraha: cinwaanka qolalka online"
            if git push -q origin HEAD:main; then
              for w in 5 15 30; do gh workflow run publish.yml --ref main && break; sleep $w; done
              exit 0
            fi
            git reset -q --hard origin/main 2>/dev/null || true
            [ "$d" = 0 ] || sleep "$d"
          done
          echo "::error::could not save data/games-online.json"; exit 1
