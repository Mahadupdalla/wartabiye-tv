name: probe sports sources (temporary)
on:
  push:
    branches: [claude/project-thread-i3qo2g]
    paths: [.github/workflows/zz-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json,urllib.request,datetime as D
          now=D.datetime.now(D.timezone.utc)
          def get(u): return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"Accept":"application/json"}),timeout=30))
          for lg in ["bl1","bl2","bl3","dfb","ucl","ucl2026","pl","pl1","la1","uel2026","uecl2026","unl","ffb1"]:
            try:
              d=get(f"https://api.openligadb.de/getmatchdata/{lg}/2026")
              past=[m for m in d if D.datetime.fromisoformat(m["matchDateTimeUTC"].replace("Z","+00:00"))<now-D.timedelta(hours=3)]
              fin=[m for m in past if m["matchIsFinished"] and m["matchResults"]]
              last=max([m["matchDateTimeUTC"] for m in fin],default=None)
              nxt=min([m["matchDateTimeUTC"] for m in d if m not in past],default=None)
              gl=sum(1 for m in fin if m["goals"])
              upd=max([m.get("lastUpdateDateTime") or "" for m in fin],default="")
              print(f"{lg:9} total={len(d):4} past={len(past):4} finished={len(fin):4} withGoals={gl:4} lastFinished={last} next={nxt} lastUpdate={upd} name={d[0]['leagueName'] if d else ''}")
            except Exception as e: print(lg,"ERR",e)
          m=get("https://api.openligadb.de/getmatchdata/bl1/2026/9")
          for x in m: print(x["matchID"],x["matchDateTimeUTC"],x["team1"]["shortName"],x["team2"]["shortName"],x["matchIsFinished"],[ (r["resultTypeID"],r["pointsTeam1"],r["pointsTeam2"]) for r in x["matchResults"]],len(x["goals"]),x.get("location"),x.get("numberOfViewers"))
          print(json.dumps(get("https://api.openligadb.de/getcurrentgroup/ucl"))) 
          print(json.dumps(get("https://api.openligadb.de/getmatchdata/83156"))[:300])
          print(json.dumps(get("https://api.openligadb.de/getavailablegroups/bl1/2026"))[:300])
          PY
          curl -sS -m 20 -o /dev/null -w "lastchange %{http_code}\n" "https://api.openligadb.de/getlastchangedate/bl1/2026/9"; curl -sS "https://api.openligadb.de/getlastchangedate/bl1/2026/9"; echo
          curl -sS -D - -o /dev/null -X OPTIONS -H "Origin: https://wartabiyetv.com" -H "Access-Control-Request-Method: GET" https://api.openligadb.de/getbltable/bl1/2026 | grep -i access-control
