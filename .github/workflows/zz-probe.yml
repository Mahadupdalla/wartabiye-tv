name: probe video and news sources (temporary)
on:
  push:
    branches: [claude/project-thread-i3qo2g]
    paths: [.github/workflows/zz-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sources
        run: |
          python3 - <<'PY'
          import re,json,urllib.request as U,xml.etree.ElementTree as ET
          H={"User-Agent":"Mozilla/5.0 (compatible; WartabiyeTV/1.0)","Accept-Language":"en"}
          def get(u,t=25):
              r=U.urlopen(U.Request(u,headers=H),timeout=t);return r.status,r.read().decode("utf8","replace")
          handles=["BBCNewsSomali","aljazeeraenglish","dwnews","France24_en","AssociatedPress","Reuters","BBCNews","aljazeeraarabic","FRANCE24"]
          ids={}
          for h in handles:
              try:
                  s,b=get("https://www.youtube.com/@"+h)
                  m=re.search(r'<link rel="canonical" href="https://www.youtube.com/channel/(UC[\w-]{22})"',b) or re.search(r'"externalId":"(UC[\w-]{22})"',b)
                  ids[h]=m.group(1) if m else None
                  print("HANDLE",h,s,ids[h])
              except Exception as e: print("HANDLE",h,"ERR",e)
          ns={"a":"http://www.w3.org/2005/Atom","yt":"http://www.youtube.com/xml/schemas/2015","media":"http://search.yahoo.com/mrss/"}
          for h,c in ids.items():
              if not c: continue
              try:
                  s,b=get("https://www.youtube.com/feeds/videos.xml?channel_id="+c)
                  root=ET.fromstring(b);ents=root.findall("a:entry",ns)
                  print("FEED",h,s,len(ents),root.findtext("a:title",None,ns))
                  for e in ents[:3]:
                      vid=e.findtext("yt:videoId",None,ns);pub=e.findtext("a:published",None,ns)
                      try:
                          s2,ob=get("https://www.youtube.com/oembed?format=json&url=https://www.youtube.com/watch?v="+vid);oe="embeddable"
                      except Exception as ex: oe="oembed "+str(ex)
                      print("  ",vid,pub,oe,e.findtext("a:title",None,ns)[:80])
              except Exception as e: print("FEED",h,"ERR",e)
              try:
                  s,b=get("https://www.youtube.com/channel/"+c+"/live")
                  m=re.search(r'<link rel="canonical" href="https://www.youtube.com/watch\?v=([\w-]{11})"',b)
                  print("LIVEPAGE",h,"canonical video",m.group(1) if m else None,"isLiveNow" ,'"isLiveNow":true' in b, "isLive",'"isLive":true' in b)
              except Exception as e: print("LIVEPAGE",h,"ERR",e)
          feeds={"BBC World":"https://feeds.bbci.co.uk/news/world/rss.xml","BBC Africa":"https://feeds.bbci.co.uk/news/world/africa/rss.xml","BBC Somali":"https://feeds.bbci.co.uk/somali/rss.xml",
            "Al Jazeera":"https://www.aljazeera.com/xml/rss/all.xml","DW":"https://rss.dw.com/rdf/rss-en-all","DW Africa":"https://rss.dw.com/rdf/rss-en-africa","France 24":"https://www.france24.com/en/rss","France 24 Africa":"https://www.france24.com/en/africa/rss",
            "AP":"https://apnews.com/index.rss","AP hub":"https://feedx.net/rss/ap.xml","Reuters":"https://www.reutersagency.com/feed/","UN News":"https://news.un.org/feed/subscribe/en/news/all/rss.xml"}
          for k,u in feeds.items():
              try:
                  s,b=get(u);items=re.findall(r"<item[ >]",b);t=re.findall(r"<(?:pubDate|dc:date)>([^<]+)<",b)[:2]
                  print("RSS",k,s,len(items),t)
              except Exception as e: print("RSS",k,"ERR",e)
          for u in ["https://www.bbc.co.uk/news/10628494","https://www.aljazeera.com/terms-and-conditions","https://www.france24.com/en/rss-feeds"]:
              try: s,b=get(u);print("TERMS",u,s,re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",b))[:0])
              except Exception as e: print("TERMS",u,"ERR",e)
          PY
      - name: public site
        run: npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node tools/live_site_check.js https://www.wartabiyetv.com/ 2>&1 | tail -80 || true
