name: 'Ilaha wararka – ururin (East Africa, World, Sports news sources)'
# Reads EVERY news source in data/world/sources.json (East Africa, World News, Sports; Somalia sources are excluded by tools/east_africa.py) EVERY HOUR FROM 06:35 TO 22:35 Africa/Nairobi,
# shortly before each hourly Claude news update (07:00-23:00 EAT; nothing runs overnight) (GitHub may start it some minutes late): RSS / news sitemap / public pages / official Telegram channel only, robots.txt respected. It
# publishes NOTHING: it removes duplicate stories, checks the publisher photos, and saves the candidate list on branch
# "world-feed". The Claude news task reads that list, writes the Somali stories and translations, finds licensed photos
# and publishes.
on:
  schedule:
    # 06:35-22:35 Africa/Nairobi (03:35-19:35 UTC), ~25 minutes before each news update (07:00-23:00 EAT, cron 0 4-20 * * * UTC).
    # 17 runs a day; nothing is collected between 23:00 and 07:00.
    - cron: '35 3-19 * * *'
  workflow_dispatch:
  push:
    # test run on a work branch when the collector changes (nothing is saved, only the report and an artifact)
    branches-ignore: [main, world-feed]
    paths: ['tools/world_news.py', 'data/world/sources.json', '.github/workflows/world-feeds.yml']
permissions:
  contents: write
concurrency:
  group: world-feeds-${{ github.ref }}
  cancel-in-progress: true
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: deleted / unpublished articles are never brought back
      - name: East Africa rule tests (no Somalia sources or Somalia-focused articles)
        run: python3 tools/east_africa.py test
      - name: Read all news sources (East Africa, World, Sports)
        # the last 48 hours; the news task then keeps only what was published since its last successful update
        run: python3 tools/world_news.py fetch --since "$(date -u -d '48 hours ago' +%FT%TZ)" --out /tmp/world/candidates.json
      - name: Remove duplicates and check images
        run: python3 tools/world_news.py dedup /tmp/world/candidates.json --out /tmp/world/plan.json
      - name: Report
        run: python3 tools/world_news.py report /tmp/world/plan.json | tee /tmp/world/report.txt
      - name: Keep the test result on the work branch (work branches only, removed before merging)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p test-run && cp /tmp/world/plan.json /tmp/world/report.txt test-run/
          git add test-run && git -c user.name=wartabiye-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "World News test run $(date -u +%FT%TZ)"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: world-news-${{ github.run_id }}
          path: /tmp/world/
          retention-days: 14
      - name: Save for the hourly update (branch world-feed)
        if: github.ref == 'refs/heads/main'
        run: |
          cd /tmp/world && git init -q -b world-feed && cp report.txt README.txt
          git add candidates.json plan.json README.txt
          git -c user.name=wartabiye-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "World News feeds $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" world-feed
