name: Daabac bogga (publish)
# Runs whenever the admin dashboard or the daily task saves content.
# Makes small card images, rebuilds data/news.json and data/ads.json, checks them, builds the article and
# section pages, sitemap.xml and rss.xml, and publishes everything to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['data/news/**', 'data/ads/**', 'data/site.json', 'data/pages.json', 'data/status.json', 'img/**', 'index.html', 'assets/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Small card images (img/news/w480)
        run: pip install -q pillow && python3 tools/make_thumbs.py
      - name: Build news.json and ads.json
        run: python3 tools/build_news.py
      - name: Check news, dates and images (nothing is published if this fails)
        run: python3 tools/check_site.py && python3 -c "import json;json.load(open('data/site.json'))"
      - name: Build article pages, section pages, sitemap and RSS
        run: python3 tools/build_pages.py
      - name: Commit the built files
        run: |
          git add -A data/news.json data/ads.json img/news/w480 war sitemap.xml rss.xml ciyaaraha caalamka xayeysiimaha xiriir nagu-saabsan anshaxa saxitaannada asturnaanta siyaasadda-xayeysiiska
          if git diff --cached --quiet; then echo "built files already up to date"; exit 0; fi
          git config user.name "wartabiye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daabac: cusboonaysii news.json iyo boggaga"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Make sure GitHub Pages publishes the newest version
        # Several saves in a row start several Pages builds, and GitHub refuses a build while another
        # is deploying. Wait, ask again, and only finish when the newest commit is really live.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          for i in $(seq 1 40); do
            head=$(git rev-parse origin/main)
            read -r status commit <<<"$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" -q '.status+" "+.commit')"
            echo "try $i: newest $head | Pages latest $commit $status"
            if [ "$commit" = "$head" ] && [ "$status" = built ]; then echo "Pages is live with $head"; exit 0; fi
            if [ "$status" != building ] && [ "$status" != queued ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" -q .status || true
            fi
            sleep 20
            git fetch -q origin main
          done
          echo "GitHub Pages did not publish $head in time"; exit 1
      - name: Start the live-site check
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-news.yml --ref main
