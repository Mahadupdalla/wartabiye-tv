name: Hubi wararka (news health check)
on:
  push:
    branches: [main]
    # the LIVE TV status file is updated by live-status.yml (only when a broadcast starts or ends); no full check for that
    paths-ignore: ['data/live-status.json', 'data/push-log.json', 'data/world/fast-status.json', 'data/sports-feed/**', 'data/live-feeds/**', 'data/automation-status.json', 'data/world/news-writer-status.json', 'data/world/sports-writer-status.json']
  schedule:
    # The news update itself is NOT scheduled here: it is the Claude scheduled task, every hour, 24/7 (Africa/Nairobi).
    # GitHub only publishes (publish.yml, on push) and checks. This check runs every 3 hours (GitHub may start it late).
    - cron: '50 */3 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check news.json and images
        run: python3 tools/check_site.py
      - name: Article completeness (self-test; the list of short articles is a report, it never blocks)
        run: |
          python3 tools/article_quality.py test
          python3 tools/article_quality.py report --all > /tmp/incomplete.txt 2> /tmp/incomplete-count.txt || true
          echo "### Incomplete articles: $(cat /tmp/incomplete-count.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Video / LIVE TV / sports rules and the sports-data proxy (no network)
        run: python3 tools/media_test.py && node --test workers/sports-api/test/worker.test.mjs && node tools/sports_feed.mjs test && python3 tools/live_feeds.py test
      - name: Notification feed, push rules and the push service (no network)
        run: python3 tools/build_notifications.py test && python3 tools/push_send.py test && node --test workers/push/test/worker.test.mjs && python3 tools/fast_monitor.py test && bash -n tools/fast_loop.sh && node --test workers/fast-trigger/test/worker.test.mjs
      - name: Check the 5-minute source check is running (0 new stories is healthy; only a stopped checker fails)
        run: |
          git fetch -q --depth=1 origin fast-feed && git show origin/fast-feed:fast-status.json > /tmp/fast-status.json
          python3 - <<'PY'
          import json, datetime, sys
          d = json.load(open('/tmp/fast-status.json', encoding='utf-8'))
          s = d.get('status') or {}
          last = s.get('lastSourceCheckAt') or d.get('lastCheckAt')
          age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(last)).total_seconds() / 60 if last else 1e9
          print(f"last source check {last} ({age:.0f} min ago) | next expected {s.get('nextExpectedCheckAt')} | "
                f"last 24 h: {s.get('checks24h')} checks, {s.get('newFound24h')} new, {s.get('published24h')} published")
          if age > 20:
              print('::error::the 5-minute source check has STOPPED (no check for more than 20 minutes): Actions -> "Ilaha degdegga ah" -> Run workflow')
              sys.exit(1)
          PY
      - name: Check the news update ran (every 3 hours 24/7; 08:00 / 18:00 only when the owner switched hourly off)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          d = json.load(open('data/news.json', encoding='utf-8'))
          try: hourly = json.load(open('data/schedule.json', encoding='utf-8')).get('hourly', True) is not False
          except Exception: hourly = True
          now = datetime.datetime.now(datetime.timezone.utc)
          limit = 4.5 if hourly else 14   # hours; news runs every 3 hours, day and night (10 Nov 2026); the scheduler does not guarantee the exact minute
          u = d.get('lastRunAt') or d.get('updatedAt')
          ok = u and (now - datetime.datetime.fromisoformat(u.replace('Z', '+00:00'))).total_seconds() < limit*3600
          print('lastRunAt', u, '| last successful update', d.get('lastSuccessAt'), '| hourly' if hourly else '| twice a day', '| fresh' if ok else f'| STALE (older than {limit} h)')
          sys.exit(0 if ok else 1)
          PY
  live:
    # Tests the real public website (GitHub Pages) in a browser, desktop and mobile. Not on a push: the publish workflow
    # starts this check itself once GitHub Pages really shows the new version (testing 2 minutes after a push raced the
    # deploy and failed for no reason); the schedule and manual starts test the site as it is.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Live data matches the repo (a few tries, the Pages cache may need a minute)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)"
          echo "Live site: $URL/"
          for d in 0 30 60 90 120; do
            sleep $d
            git fetch -q origin main && git checkout -q origin/main -- data/news.json
            curl -fsS --retry 3 --retry-delay 5 "$URL/data/news.json?ts=$(date +%s)" -o live.json || continue
            python3 - <<'PY' && exit 0
          import json, sys
          repo = json.load(open('data/news.json', encoding='utf-8'))
          live = json.load(open('live.json', encoding='utf-8'))
          sys.exit(0 if (len(repo['news']) == len(live['news']) and repo.get('lastRunAt') == live.get('lastRunAt')) else 1)
          PY
          done
          python3 - <<'PY'
          import json, sys
          repo = json.load(open('data/news.json', encoding='utf-8'))
          live = json.load(open('live.json', encoding='utf-8'))
          r, l = len(repo['news']), len(live['news'])
          print('articles repo', r, 'live', l, '| lastRunAt repo', repo.get('lastRunAt'), 'live', live.get('lastRunAt'))
          sys.exit(0 if (r == l and repo.get('lastRunAt') == live.get('lastRunAt')) else 1)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Browser test of the live site
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          mkdir -p shots && node tools/live_test.js "$URL" shots
      - name: Language switcher test (Somali, English, Arabic, French; desktop and mobile)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          node tools/lang_test.js "$URL" shots
      - name: Video News, LIVE TV and LIVE Sports test (desktop and mobile; LIVE only when verified)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          node tools/media_test.js "$URL" shots
      - name: Open football data still answers for every league (warnings only)
        run: python3 tools/sports_open_check.py
      - name: Notification bell test (desktop and mobile; every alert opens a real published story)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          node tools/notify_test.js "$URL" shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: shots/
