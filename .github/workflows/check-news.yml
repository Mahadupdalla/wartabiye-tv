name: Hubi wararka (news health check)
on:
  push:
    branches: [main]
    # the LIVE TV status file is updated by live-status.yml (only when a broadcast starts or ends); no full check for that
    paths-ignore: ['data/live-status.json']
  schedule:
    # The news update itself is NOT scheduled here: it is the Claude scheduled task at 08:00 and 18:00
    # Africa/Nairobi (05:00 and 15:00 UTC). GitHub only publishes (publish.yml, on push) and checks.
    # This check runs 2h20m after each update: 10:20 and 20:20 Nairobi (07:20 and 17:20 UTC).
    - cron: '20 7,17 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check news.json and images
        run: python3 tools/check_site.py
      - name: Video / LIVE TV / sports rules and the sports-data proxy (no network)
        run: python3 tools/media_test.py && node --test workers/sports-api/test/
      - name: Check the 08:00 / 18:00 update ran (lastRunAt under 4 hours old)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          d = json.load(open('data/news.json', encoding='utf-8'))
          u = d.get('lastRunAt') or d.get('updatedAt')
          now = datetime.datetime.now(datetime.timezone.utc)
          ok = u and (now - datetime.datetime.fromisoformat(u.replace('Z', '+00:00'))).total_seconds() < 4*3600
          print('lastRunAt', u, 'fresh' if ok else 'STALE')
          sys.exit(0 if ok else 1)
          PY
  live:
    # Tests the real public website (GitHub Pages) in a browser, desktop and mobile.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish this commit
        if: github.event_name != 'schedule'
        run: sleep 120
      - name: Live data matches the repo
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)"
          echo "Live site: $URL/"
          curl -fsS "$URL/data/news.json?ts=$(date +%s)" -o live.json
          python3 - <<'PY'
          import json, sys
          repo = json.load(open('data/news.json', encoding='utf-8'))
          live = json.load(open('live.json', encoding='utf-8'))
          r, l = len(repo['news']), len(live['news'])
          print('articles repo', r, 'live', l, '| lastRunAt repo', repo.get('lastRunAt'), 'live', live.get('lastRunAt'))
          sys.exit(0 if (r == l and repo.get('lastRunAt') == live.get('lastRunAt')) else 1)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Browser test of the live site
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          mkdir -p shots && node tools/live_test.js "$URL" shots
      - name: Language switcher test (Somali, English, Arabic, French; desktop and mobile)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          node tools/lang_test.js "$URL" shots
      - name: Video News, LIVE TV and LIVE Sports test (desktop and mobile; LIVE only when verified)
        run: |
          URL="https://$(tr -d '[:space:]' < CNAME)/"
          node tools/media_test.js "$URL" shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: shots/
