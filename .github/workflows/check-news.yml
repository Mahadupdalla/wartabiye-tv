name: Hubi wararka (news health check)
on:
  push:
    branches: [main]
  schedule:
    # 06:45 Africa/Nairobi (03:45 UTC), after the 06:00 news update
    - cron: '45 3 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check news.json and images
        run: python3 tools/check_site.py
      - name: Check the update ran today
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          d = json.load(open('data/news.json', encoding='utf-8'))
          u = d.get('lastRunAt') or d.get('updatedAt')
          now = datetime.datetime.now(datetime.timezone.utc)
          ok = u and (now - datetime.datetime.fromisoformat(u.replace('Z', '+00:00'))).total_seconds() < 26*3600
          print('lastRunAt', u, 'fresh' if ok else 'STALE')
          sys.exit(0 if ok else 1)
          PY
  live:
    # Tests the real public website (GitHub Pages) in a browser, desktop and mobile.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish this commit
        if: github.event_name == 'push'
        run: sleep 120
      - name: Live data matches the repo
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          echo "Live site: $URL/"
          curl -fsS "$URL/data/news.json?ts=$(date +%s)" -o live.json
          python3 - <<'PY'
          import json, sys
          repo = json.load(open('data/news.json', encoding='utf-8'))
          live = json.load(open('live.json', encoding='utf-8'))
          r, l = len(repo['news']), len(live['news'])
          print('articles repo', r, 'live', l, '| lastRunAt repo', repo.get('lastRunAt'), 'live', live.get('lastRunAt'))
          sys.exit(0 if (r == l and repo.get('lastRunAt') == live.get('lastRunAt')) else 1)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Browser test of the live site
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          mkdir -p shots && node tools/live_test.js "$URL" shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: shots/
