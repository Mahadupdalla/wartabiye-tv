name: LIVE TV xaqiijin (live status check)
# Every 10 minutes: asks the official YouTube Data API whether the Wartabiye TV live stream set in /admin/ (LIVE TV) is
# really on air, and saves the answer in data/live-status.json. The site shows the red LIVE sign only from this
# answer (or from the admin's manual "On air" switch with an end time). The API key is the repository secret
# YOUTUBE_API_KEY (Settings → Secrets and variables → Actions); it never appears in the public site.
# Nothing is committed unless the status changes (start, end, new scheduled broadcast) or every 25 minutes while live.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/live.json']
permissions:
  contents: write
  pages: write
concurrency:
  group: live-status
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ask YouTube whether the official stream is live
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/live_status.py
      - name: Save the status (only when it changed)
        run: |
          git diff --quiet -- data/live-status.json && { echo "no change"; exit 0; }
          git config user.name "wartabiye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-status.json && git commit -q -m "LIVE TV: status $(python3 -c "import json;print('LIVE' if json.load(open('data/live-status.json'))['live'] else 'offline')")"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: save
      - name: Publish the new status on GitHub Pages
        if: steps.save.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" -q .status || true
