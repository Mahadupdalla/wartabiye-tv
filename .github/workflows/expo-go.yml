name: iPhone preview in Expo Go
# Sends the app's code to Expo's free update service so it runs in the Expo Go app on the owner's iPhone, without the
# Apple Developer Program. One fixed QR code / link: the pre-release "expo-go". Needs, once (see mobile/EXPO-GO.md):
#   secret   EXPO_TOKEN      an access token of the owner's free Expo account
#   variable EAS_PROJECT_ID  the id of the "wartabiye-tv" project on expo.dev
# Nothing here pays for anything; Expo Go cannot receive push notifications (TestFlight builds can).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/expo-go.yml']
permissions:
  contents: write   # only to publish the QR code as the "expo-go" pre-release
concurrency:
  group: expo-go
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      link: ${{ steps.qr.outputs.link }}
      sdk: ${{ steps.qr.outputs.sdk }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      WTV_EXPO_GO: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Owner's Expo settings present?
        id: cfg
        run: |
          if [ -z "$EXPO_TOKEN" ] || [ -z "$EAS_PROJECT_ID" ]; then
            echo "### Expo Go preview: not set up yet" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the secret EXPO_TOKEN and the variable EAS_PROJECT_ID (mobile/EXPO-GO.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        if: steps.cfg.outputs.ready == '1'
      - name: Does the Expo Go app in the App Store run this SDK?
        if: steps.cfg.outputs.ready == '1'
        run: |
          SDK=$(node -p "require('expo/package.json').version.split('.')[0]").0.0
          curl -fsS https://exp.host/--/api/v2/versions/latest > /tmp/versions.json
          node -e '
            const v = require("/tmp/versions.json"); const d = (v.data || v).sdkVersions || {};
            const s = process.argv[1], e = d[s];
            const newest = Object.keys(d).filter(k => !d[k].beta).sort((a, b) => parseInt(b) - parseInt(a))[0];
            const line = e ? `SDK ${s} is known to Expo Go (iOS Expo Go ${e.iosClientVersion || "?"}${e.isDeprecated ? ", deprecated" : ""}${e.beta ? ", beta" : ""}); newest SDK: ${newest}`
                           : `SDK ${s} is not listed by Expo; newest SDK: ${newest}`;
            console.log(line); require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n" + line + "\n");
          ' "$SDK"
      - name: Updates library (only for this preview, not committed)
        if: steps.cfg.outputs.ready == '1'
        run: npx expo install expo-updates
      - name: Only the public app goes out (no admin feature, address, key or token in the code sent to Expo)
        if: steps.cfg.outputs.ready == '1'
        run: |
          npx expo export --platform ios --platform android --output-dir /tmp/scan > /tmp/export.log 2>&1 || { tail -40 /tmp/export.log; exit 1; }
          ls -la /tmp/scan/_expo/static/js/ios /tmp/scan/_expo/static/js/android
          bad=0
          for s in ghp_ github_pat_ gho_ ghu_ ghs_ x-access-token PUSH_ADMIN_TOKEN SESSION_SECRET VAPID_PRIVATE ANTHROPIC api.anthropic.com sk-ant- CLOUDFLARE_API_TOKEN api.cloudflare.com /api/github /api/me /api/security /api/automation /api/analytics wartabiye-admin.wartabiye.workers.dev/login /admin/ 'BEGIN PRIVATE KEY'; do
            if grep -a -r -F -q -- "$s" /tmp/scan/_expo; then echo "FOUND in the app code: $s"; bad=1; fi
          done
          if grep -a -r -F -q -- "$EXPO_TOKEN" /tmp/scan/_expo; then echo "FOUND in the app code: the Expo token"; bad=1; fi
          [ $bad = 0 ] && echo "No admin feature, address, key or token in the iPhone and Android code"
      - name: Publish to Expo (channel expo-go)
        if: steps.cfg.outputs.ready == '1'
        run: |
          npx eas-cli@latest update --channel expo-go --environment production --message "$(git log -1 --format=%s | cut -c1-80)" \
            --non-interactive --json > /tmp/update.json || npx eas-cli@latest update --channel expo-go \
            --message "$(git log -1 --format=%s | cut -c1-80)" --non-interactive --json > /tmp/update.json
          cat /tmp/update.json
      - name: Link and QR code for the iPhone
        id: qr
        if: steps.cfg.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK=$(node -p "require('expo/package.json').version.split('.')[0]").0.0
          GROUP=$(node -p "const u=require('/tmp/update.json'); (Array.isArray(u)?u:[u]).find(x=>x.platform==='ios')?.group || (Array.isArray(u)?u[0]:u).group")
          LINK="exp://u.expo.dev/$EAS_PROJECT_ID/group/$GROUP"
          CHANNEL="exp://u.expo.dev/$EAS_PROJECT_ID?channel-name=expo-go&runtime-version=exposdk:$SDK"
          echo "link=$CHANNEL" >> "$GITHUB_OUTPUT"; echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          pip install --quiet "qrcode[pil]"
          python3 -c "import qrcode,sys; qrcode.make(sys.argv[1]).save('/tmp/wartabiye-tv-expo-go-qr.png')" "$CHANNEL"
          { echo "### Expo Go preview published"; echo; echo "Always the newest: \`$CHANNEL\`"; echo; echo "This update: \`$LINK\`"; } >> "$GITHUB_STEP_SUMMARY"
          gh release delete expo-go --cleanup-tag -y || true
          gh release create expo-go /tmp/wartabiye-tv-expo-go-qr.png --prerelease --target "$GITHUB_SHA" \
            --title "Wartabiye TV in Expo Go (iPhone preview)" \
            --notes "Scan the QR code with the iPhone Camera (Expo Go must be installed from the App Store), or open this link on the iPhone: $CHANNEL . It always loads the newest code of main. Commit $GITHUB_SHA. Push notifications do not work in Expo Go."

  iphone:
    # the published update in the real Expo Go app (the version Expo lists for this SDK) on an iPhone simulator,
    # opened through the same link as the QR code: news, pictures, the nine languages and a story opened in the app
    needs: publish
    if: needs.publish.outputs.link != ''
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the machine
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Maestro (taps on the simulator)
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Wartabiye TV in Expo Go on an iPhone simulator
        run: python3 test/expo-go-ios.py "${{ needs.publish.outputs.link }}" test/output/expo-go "${{ needs.publish.outputs.sdk }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expo-go-iphone-test
          path: |
            mobile/test/output/expo-go/*.png
            mobile/test/output/expo-go/*.json
            mobile/test/output/expo-go/*.txt
            mobile/test/output/expo-go/flow.yaml
          retention-days: 30
      - name: Screenshots next to the QR code
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls test/output/expo-go/expo-go-*.png >/dev/null 2>&1 || exit 0
          gh release upload expo-go test/output/expo-go/expo-go-*.png test/output/expo-go/expo-go-results.json --clobber || true
