name: Muuqaal iyo wararka tooska (live feeds)
# Newest videos from the publishers' official YouTube channels (only when the publisher allows embedding) and the latest
# headlines from the newsrooms' official RSS feeds, as set in /admin/ → Ilaha muuqaalka iyo wararka tooska
# (data/media-sources.json). No Claude run needed.
# The regular 5-minute updates, 24/7, are done by the ONE source-check loop (fast-sources.yml → tools/fast_loop.sh →
# tools/live_feeds_cycle.sh). GitHub's own "*/5" schedule did not fire on this repository, which left the LIVE News
# sources stale (last update 23:09 on 8 Nov 2026), so this workflow no longer has a timer: it runs when its settings or
# code change on main, or when started by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/media-sources.json', 'tools/live_feeds.py']
permissions:
  contents: write
concurrency:
  group: live-feeds
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Update the live feeds (branch live-data, hourly copy on main)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: cp tools/live_feeds_cycle.sh /tmp/c.sh && bash /tmp/c.sh
