name: 'Ilaha degdegga ah – 5 daqiiqo (5-minute source monitor)'
# THE ONE source-check system of Wartabiye TV (owner's rule, 8 Nov 2026): every source in data/world/sources.json marked
# "fastPoll" is checked every 5 minutes, 24 hours a day, 7 days a week (data/schedule.json "hours": "24/7"; Africa/Nairobi).
# Cheap checks only: official RSS / news sitemaps, conditional GET, robots.txt respected, no Claude run, no browser.
# It publishes NOTHING by itself: genuinely new stories (never-seen ids; age measured from the PUBLISHER's own time:
# <= 5 min = priority 1 "fresh", up to 2 h = priority 2 fallback, older = rejected; no trustworthy time = not passed on)
# go to branch "fast-feed" (candidates.json) and to the news task's list (branch world-feed). The news task writes,
# verifies, adds a licensed photo and publishes; the publish workflow adds the story to the bell and sends push alerts only
# after GitHub Pages is live. Diagnostics and the per-check log: data/world/fast-status.json (/admin/) and branch fast-feed.
#
# The clock: GitHub's own "*/5" schedule does not fire on this repository (not one scheduled start on 8 Nov 2026), so each
# run is ONE long job that checks at every 5-minute mark for about 5.5 hours (tools/fast_loop.sh) and then starts the next
# run itself. The concurrency group allows one running loop; any extra start (the schedule below, the news task, the
# optional Cloudflare clock in workers/fast-trigger, a manual start) waits in the queue and never checks at the same time.
# The repository is public, so these Actions minutes are free.
on:
  schedule:
    - cron: '*/5 * * * *'   # only a back-up starter if the chain ever stops (GitHub rarely fires it here)
  workflow_dispatch:
    inputs:
      force:
        description: 'Check even outside operating hours'
        type: boolean
        default: false
      minutes:
        description: 'How long this run keeps checking (minutes, at most 330)'
        type: number
        default: 330
  push:
    # test run on a work branch when the monitor changes (nothing is saved)
    branches-ignore: [main, world-feed, fast-feed]
    paths: ['tools/fast_monitor.py', 'tools/fast_loop.sh', 'tools/news_writer.py', 'tools/automation_watchdog.py', 'tools/quarantine.py', 'tools/live_feeds_cycle.sh', 'tools/world_news.py', 'tools/sports_results.py', 'tools/sports_writer.py', 'data/world/sources.json', '.github/workflows/fast-sources.yml']
permissions:
  contents: write
  issues: write
  pages: write     # to publish new LIVE Sports scores (tools/fast_loop.sh sports_cycle)
  actions: write   # to start the next loop
concurrency:
  group: fast-sources-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300   # enough history to read when each article file first reached main
      - name: Self-test (no network)
        run: python3 tools/fast_monitor.py test && python3 tools/live_feeds.py test && python3 tools/sports_results.py test && python3 tools/sports_writer.py test && python3 tools/news_writer.py test && python3 tools/automation_watchdog.py test && python3 tools/quarantine.py test && bash -n tools/fast_loop.sh
      - name: Feed check (work branches only)
        if: github.ref != 'refs/heads/main'
        run: python3 tools/fast_monitor.py probe
      - name: Publishing watchdog dry run (work branches only, starts nothing)
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WATCHDOG_DRY: '1'
        run: |
          mkdir -p /tmp/wd && git fetch -q origin main fast-feed && git show origin/fast-feed:fast-status.json > /tmp/wd/fast-status.json || true
          git checkout -q origin/main -- data/news.json
          python3 tools/automation_watchdog.py run --state /tmp/wd && cat /tmp/wd/automation-status.json
          git checkout -q HEAD -- data/news.json
      - name: One check (work branches only, nothing saved)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir -p /tmp/fast
          python3 tools/fast_monitor.py run --state /tmp/fast --force
          cat /tmp/fast/README.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Check every source at every 5-minute mark (about 5.5 hours)
        if: github.ref == 'refs/heads/main'
        id: loop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # LIVE Sports scores (Premier League, LaLiga, Serie A, Ligue 1 ...): optional free key from football-data.org
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # sports NEWS articles written by Claude (tools/sports_writer.py): the owner's own API key from console.anthropic.com,
          # billed per use by Anthropic, separate from the owner's Claude plan. Without it the sports writer stays off.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPORTS_WRITER_DAILY_MAX: ${{ vars.SPORTS_WRITER_DAILY_MAX || '40' }}
          # World News + Somalia & East Africa articles on the same key (tools/news_writer.py). "fallback" = only while the
          # hourly Claude routine has stopped (e.g. Claude Max limit reached); "always" = every fresh story; "off".
          NEWS_WRITER_MODE: ${{ vars.NEWS_WRITER_MODE || 'fallback' }}
          NEWS_WRITER_DAILY_MAX: ${{ vars.NEWS_WRITER_DAILY_MAX || '24' }}
          NEWS_WRITER_MODEL: ${{ vars.NEWS_WRITER_MODEL || 'claude-opus-5-5' }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          LOOP_MINUTES: ${{ inputs.minutes || 330 }}
        run: |
          # run a copy: the loop updates the checkout to the newest main before every check
          cp tools/fast_loop.sh /tmp/fast_loop.sh && bash /tmp/fast_loop.sh
      - name: Start the next loop (the chain that keeps the checks going day and night)
        # also after a failed loop (a crash must never stop the 24/7 checks); not when someone cancelled the run
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do gh workflow run fast-sources.yml --repo "${{ github.repository }}" --ref main && exit 0; sleep 10; done
          echo "::error::could not start the next loop; the schedule, the news task or a manual start will restart it"; exit 1
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: fast-monitor-${{ github.run_id }}
          path: /tmp/fast/
          retention-days: 7
