name: Mobile app (Android build + tests)
# The Wartabiye TV app (mobile/, React Native + Expo) for Android and iPhone, and the web app at /app/.
# Runs when the app's code changes, or by hand from the Actions tab. It never publishes anything and makes no AI calls.
#  1. typecheck + the data / push / analytics tests
#  2. the synchronisation test (new article, edit, new image, unpublish, offline) on a private copy of the content
#  3. the app checks against the LIVE website https://www.wartabiyetv.com/ (9 languages, sections, LIVE, bookmarks, sizes)
#  4. an installable Android APK (test build) and a release AAB, kept as downloadable files of the run (30 days).
#  5. the real APK on an Android emulator: it opens and shows the newest headline of the live website
#  6. the web app ON the live website (https://www.wartabiyetv.com/app/) after GitHub Pages published it
#  7. on main only: the tested APK replaces the file of the pre-release "android-test-build" (one fixed download link)
#     Without the owner's upload key (secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#     ANDROID_KEY_PASSWORD) both are signed with a test key: fine for installing on phones, not accepted by Google Play.
on:
  push:
    paths: ['mobile/**', 'app/**', 'tools/build_app_api.py', 'workers/push/**', '.github/workflows/mobile-app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Links stay inside the app (website addresses -> app screens, admin never)
        run: node --experimental-strip-types --test test/links.test.mjs
      - name: Content API and push tests
        working-directory: .
        run: |
          python3 tools/build_app_api.py test
          python3 tools/push_send.py test
          node --test workers/push/test/worker.test.mjs
      - name: Browser for the tests
        # Playwright only for these tests (not an app dependency)
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Synchronisation test (publish, edit, new image, unpublish, offline)
        run: node test/sync.e2e.mjs
      - name: App checks against the live website
        run: |
          # GitHub Pages serves the website; if api/v1 is not published yet the app reads data/news.json (same content)
          node test/app.e2e.mjs --live https://www.wartabiyetv.com/
      - name: The admin API refuses public requests (server-side, also forged cookies, tokens and write methods)
        run: sh test/security-live.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-screenshots
          path: mobile/test/output
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the Android project (Expo prebuild)
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: npx expo prebuild --platform android --no-install --clean
      - name: Release signing key (owner's key if configured, otherwise a test key)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.keystore
            echo "SIGNING=owner" >> "$GITHUB_ENV"
          else
            # the same public test key every time, so a new test build installs over the old one
            cp test-signing/test-build.keystore android/app/release.keystore
            KS_PASS=testtest; KEY_ALIAS=test; KEY_PASS=testtest
            echo "SIGNING=test" >> "$GITHUB_ENV"
          fi
          # leading newline: the generated gradle.properties may not end with one
          printf '\nWTV_STORE_FILE=release.keystore\nWTV_STORE_PASSWORD=%s\nWTV_KEY_ALIAS=%s\nWTV_KEY_PASSWORD=%s\n' \
            "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" >> android/gradle.properties
          # use this key for the release build type
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = s.replace("signingConfigs {", """signingConfigs {
                  wtvRelease {
                      storeFile file(project.property('WTV_STORE_FILE'))
                      storePassword project.property('WTV_STORE_PASSWORD')
                      keyAlias project.property('WTV_KEY_ALIAS')
                      keyPassword project.property('WTV_KEY_PASSWORD')
                  }""", 1)
          s = re.sub(r"(release \{[^}]*?)signingConfig signingConfigs\.debug", r"\1signingConfig signingConfigs.wtvRelease", s, count=1, flags=re.S)
          # every build gets a higher version number, so Android accepts it as an update
          s = re.sub(r"versionCode \d+", "versionCode " + os.environ['GITHUB_RUN_NUMBER'], s, count=1)
          open(p, 'w').write(s)
          print('release signing:', 'wtvRelease' in s)
          PY
      - name: Build the APK (installable test build) and the AAB (Google Play)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Collect
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/wartabiye-tv-$SIGNING-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../dist/wartabiye-tv-$SIGNING-signed.aab
          ls -la ../dist
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/aapt2 dump badging ../dist/*.apk | head -3 || true
      - name: The APK holds no admin feature, address, key or token
        run: |
          rm -rf /tmp/apk && mkdir -p /tmp/apk && cd /tmp/apk && unzip -q "$GITHUB_WORKSPACE"/dist/*.apk assets/index.android.bundle
          ls -la assets/index.android.bundle
          bad=0
          for s in ghp_ github_pat_ gho_ ghu_ ghs_ x-access-token PUSH_ADMIN_TOKEN SESSION_SECRET VAPID_PRIVATE ANTHROPIC api.anthropic.com sk-ant- CLOUDFLARE_API_TOKEN api.cloudflare.com /api/github /api/me /api/security /api/automation /api/analytics wartabiye-admin.wartabiye.workers.dev/login /admin/ 'BEGIN PRIVATE KEY'; do
            if grep -a -F -q -- "$s" assets/index.android.bundle; then echo "FOUND in the app: $s"; bad=1; else echo "absent: $s"; fi
          done
          [ $bad = 0 ]
      - uses: actions/upload-artifact@v4
        with:
          name: wartabiye-tv-android
          path: dist
          retention-days: 30

  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wartabiye-tv-android
          path: dist
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install and open the APK on an Android emulator (reads the live website)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sh mobile/test/android-smoke.sh "$(ls dist/*.apk)" mobile/test/output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshot
          path: mobile/test/output
          retention-days: 30

  ios:
    # the real iPhone app (same code) built for the iOS Simulator and opened on an iPhone simulator. TestFlight needs
    # the owner's Apple Developer account, so this build is unsigned and only runs in the simulator.
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate the iPhone project (Expo prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean
      - name: Build for the iOS Simulator (Release)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS scheme $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO build | tail -40
          APP=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls -la "$APP"
      - name: Open it on an iPhone simulator (reads the live website)
        run: sh test/ios-smoke.sh "$APP" test/output
      - name: Keep the simulator build
        if: always()
        run: |
          mkdir -p ../dist-ios
          [ -n "$APP" ] && (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/dist-ios/wartabiye-tv-ios-simulator.zip" "$(basename "$APP")") || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wartabiye-tv-ios-simulator
          path: |
            dist-ios
            mobile/test/output
          retention-days: 30

  test-build-link:
    # one fixed link for testers: https://github.com/<repo>/releases/download/android-test-build/wartabiye-tv.apk
    needs: [test, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wartabiye-tv-android
          path: dist
      - name: Replace the APK of the "android-test-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/*.apk wartabiye-tv.apk
          gh release delete android-test-build --cleanup-tag -y || true
          gh release create android-test-build wartabiye-tv.apk --prerelease --target "$GITHUB_SHA" \
            --title "Wartabiye TV Android test build" \
            --notes "Test build of the Wartabiye TV app for Android, built and tested from commit $GITHUB_SHA. Signed with a $(ls dist/*.apk | grep -q owner && echo 'owner' || echo 'test') key: install it on a phone (allow installing unknown apps). It is not the Google Play version."

  pwa-live:
    # the installable web app as published on the live website (waits for GitHub Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser
        run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - name: The web app on https://www.wartabiyetv.com/app/
        run: node test/pwa-live.mjs https://www.wartabiyetv.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-live-screenshots
          path: mobile/test/output
          retention-days: 30
