# Wartabiye TV push notifications (Cloudflare Workers + Workers KV, free plan is enough).
# Deployed by the GitHub workflow "Push: deploy the notification service (Cloudflare)" (.github/workflows/push-deploy.yml):
# it creates the KV namespace (and puts its id in here at deploy time), deploys, and stores the VAPID keys as Cloudflare
# SECRETS (VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK). No key and no password is ever in this file. See README.md.
name = "wartabiye-push"
main = "src/index.js"
compatibility_date = "2024-11-01"

kv_namespaces = [
  { binding = "SUBS", id = "PASTE_KV_NAMESPACE_ID_HERE" }
]

[vars]
# only these sites may subscribe from a browser
ALLOWED_ORIGINS = "https://www.wartabiyetv.com,https://wartabiyetv.com"
# every notification must link to a page of this site
SITE_URL = "https://www.wartabiyetv.com/"
# contact address the browser push services can use (RFC 8292)
VAPID_SUBJECT = "mailto:admin@wartabiyetv.com"
# GITHUB_REPO (the only repository whose main-branch workflows may send) is set by the deploy workflow.
